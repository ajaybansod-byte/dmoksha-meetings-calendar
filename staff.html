<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="D'Moksha Staff" />
<title>D'Moksha Staff</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Ctext x='50' y='64' text-anchor='middle' font-family='serif' font-weight='bold' font-size='46' fill='white'%3ED%3C/text%3E%3C/svg%3E" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
  Babel.registerPreset("react-classic", { presets: [[Babel.availablePresets["react"], { runtime: "classic" }]] });
</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  body { background:#f8fafc; font-family:"Segoe UI",Roboto,system-ui,-apple-system,sans-serif; color:#1f2937; }
  input, select, textarea, button { box-sizing:border-box; max-width:100%; }
  .pb-safe { padding-bottom: max(env(safe-area-inset-bottom,0px), 0.75rem); }
  @keyframes spin { to { transform: rotate(360deg); } } .spinner { animation: spin .7s linear infinite; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="env,react-classic">
const { useState, useEffect, useMemo } = React;
const SUPABASE_URL = "https://pncdmkqhfclymmyldmas.supabase.co";
const SUPABASE_KEY = "sb_publishable_Mm7ImJtTtEQIAR9KK1DLzw_QGkhptKA";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const EMAIL_DOMAIN = "@staff.dmoksha";

const pad = n => String(n).padStart(2, "0");
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate()+n); return toISO(d); };
const niceDate = iso => { const d = new Date(iso + "T00:00:00"); return d.toLocaleDateString("en-IN", { weekday:"short", day:"numeric", month:"short" }); };
const timeToMinutes = s => { if(!s) return null; const m = String(s).match(/(\d{1,2})\s*[:.]?\s*(\d{1,2})?\s*([aApP][mM])?/); if(!m) return null; let h = parseInt(m[1],10)%12; if((m[3]||"").toUpperCase()==="PM") h+=12; return h*60+parseInt(m[2]||"0",10); };
const inr = n => "₹" + Number(n||0).toLocaleString("en-IN", { maximumFractionDigits: 0 });
const publicUrl = path => path ? supabase.storage.from("invoices").getPublicUrl(path).data.publicUrl : null;

function App() {
  const [session, setSession] = useState(undefined);
  const [staff, setStaff] = useState(null);
  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = supabase.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);
  useEffect(() => {
    if (!session) { setStaff(null); return; }
    supabase.from("staff").select("*").eq("auth_user_id", session.user.id).single()
      .then(({ data }) => setStaff(data || false));
  }, [session]);

  if (session === undefined) return <Center><Spinner /></Center>;
  if (!session) return <Login />;
  if (staff === null) return <Center><Spinner /></Center>;
  if (staff === false) return <Center><div className="text-center text-gray-600 p-6">Your login isn't linked to a staff profile. Please contact admin.<br/><button onClick={() => supabase.auth.signOut()} className="mt-4 text-blue-600 underline">Sign out</button></div></Center>;
  return <Home staff={staff} />;
}

const Center = ({ children }) => <div className="min-h-screen flex items-center justify-center">{children}</div>;
const Spinner = () => <div className="spinner h-8 w-8 border-4 border-blue-500 border-t-transparent rounded-full" />;
const Logo = ({ className = "h-10" }) => (
  <svg viewBox="0 0 240 64" className={className}><text x="120" y="36" textAnchor="middle" fontFamily="serif" fontWeight="700" fontSize="30" fill="#111827" letterSpacing="2">D'MOKSHA</text><text x="120" y="56" textAnchor="middle" fontFamily="sans-serif" fontWeight="300" fontSize="14" fill="#111827" letterSpacing="6">HOMES</text></svg>
);

function Login() {
  const [mobile, setMobile] = useState(""); const [pw, setPw] = useState("");
  const [err, setErr] = useState(null); const [busy, setBusy] = useState(false);
  const submit = async e => {
    e.preventDefault(); setErr(null);
    const m = mobile.replace(/\D/g, "").slice(-10);
    if (m.length !== 10) { setErr("Enter your 10-digit mobile number."); return; }
    setBusy(true);
    const { error } = await supabase.auth.signInWithPassword({ email: m + EMAIL_DOMAIN, password: pw });
    setBusy(false);
    if (error) setErr("Mobile number or password is incorrect.");
  };
  return (
    <div className="min-h-screen flex flex-col items-center justify-center p-6">
      <Logo className="h-14 mb-2" />
      <div className="text-sm text-gray-500 mb-8">Staff portal</div>
      <form onSubmit={submit} className="w-full max-w-sm bg-white border border-gray-200 rounded-2xl shadow p-5 space-y-4">
        <label className="block"><span className="text-xs uppercase tracking-wider text-gray-500 font-semibold">Mobile number</span>
          <input type="tel" inputMode="numeric" autoComplete="username" value={mobile} onChange={e => setMobile(e.target.value)} placeholder="10-digit mobile" className="mt-1 w-full border border-gray-300 rounded-lg px-3 py-3 text-base focus:outline-none focus:border-blue-500" /></label>
        <label className="block"><span className="text-xs uppercase tracking-wider text-gray-500 font-semibold">Password</span>
          <input type="password" autoComplete="current-password" value={pw} onChange={e => setPw(e.target.value)} className="mt-1 w-full border border-gray-300 rounded-lg px-3 py-3 text-base focus:outline-none focus:border-blue-500" /></label>
        {err && <div className="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg p-3">{err}</div>}
        <button disabled={busy} className="w-full py-3 rounded-lg bg-blue-600 text-white font-semibold disabled:opacity-60">{busy ? "Signing in…" : "Sign in"}</button>
      </form>
    </div>
  );
}

function Home({ staff }) {
  const [tab, setTab] = useState("today");
  const [menu, setMenu] = useState(false);
  const [pwOpen, setPwOpen] = useState(false);
  const [refreshKey, setRefreshKey] = useState(0);
  const refresh = () => setRefreshKey(k => k + 1);
  return (
    <div className="min-h-screen pb-24">
      <header className="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div className="px-4 py-3 flex items-center justify-between">
          <div className="flex items-center gap-3"><Logo className="h-8" /><div><div className="text-sm font-semibold text-gray-900">{staff.name}</div><div className="text-[11px] text-gray-500 capitalize">{staff.role} · {staff.city}</div></div></div>
          <button onClick={() => setMenu(m => !m)} className="w-9 h-9 rounded-full hover:bg-gray-100 inline-flex items-center justify-center text-gray-700">⋮</button>
        </div>
        {menu && <div className="absolute right-3 top-14 bg-white border border-gray-200 rounded-lg shadow-lg text-sm w-48">
          <button onClick={() => { setMenu(false); setPwOpen(true); }} className="block w-full text-left px-4 py-3 hover:bg-gray-50">Change password</button>
          <button onClick={() => supabase.auth.signOut()} className="block w-full text-left px-4 py-3 hover:bg-gray-50 text-red-600">Sign out</button>
        </div>}
      </header>
      <main className="px-4 py-4">
        {tab === "today" && <DayList staff={staff} date={toISO(new Date())} refreshKey={refreshKey} onChanged={refresh} />}
        {tab === "tomorrow" && <DayList staff={staff} date={addDays(toISO(new Date()), 1)} refreshKey={refreshKey} onChanged={refresh} />}
        {tab === "expenses" && <MyExpenses staff={staff} refreshKey={refreshKey} />}
      </main>
      <nav className="fixed bottom-0 inset-x-0 bg-white border-t border-gray-200 pb-safe z-30">
        <div className="grid grid-cols-3">
          {[["today","Today"],["tomorrow","Tomorrow"],["expenses","My expenses"]].map(([k,l]) => (
            <button key={k} onClick={() => setTab(k)} className={`py-3 text-sm font-medium ${tab === k ? "text-blue-600 border-t-2 border-blue-600 -mt-px" : "text-gray-500"}`}>{l}</button>
          ))}
        </div>
      </nav>
      {pwOpen && <ChangePassword onClose={() => setPwOpen(false)} />}
    </div>
  );
}

function DayList({ staff, date, refreshKey, onChanged }) {
  const [rows, setRows] = useState(null);
  const [expenses, setExpenses] = useState([]);
  const [open, setOpen] = useState(null);
  useEffect(() => {
    let alive = true;
    (async () => {
      const [m, v, e] = await Promise.all([
        supabase.from("designer_meetings").select("*").eq("meeting_date", date).is("deleted_at", null).or(`designer_name.eq.${staff.name},support_name.eq.${staff.name}`),
        supabase.from("field_visits").select("*").eq("visit_date", date).is("deleted_at", null).or(`stylist.eq.${staff.name},support_name.eq.${staff.name}`),
        supabase.from("travel_expenses").select("id,meeting_id,visit_id").eq("staff_id", staff.id).eq("expense_date", date),
      ]);
      if (!alive) return;
      const mm = (m.data || []).map(x => ({ kind:"meeting", id:x.id, time:x.timing_from || x.timing || "", customer:x.customer_name, mobile:x.mobile_number, address:[x.address, x.area].filter(Boolean).join(", "), visit:x.visit_type || "Meeting", partner: staff.role === "designer" ? x.support_name : x.designer_name, type:x.meeting_type }));
      const vv = (v.data || []).map(x => ({ kind:"visit", id:x.id, time:x.timing || "", customer:x.customer_name, mobile:null, address:x.address || "", visit:x.visit_type || "", partner: staff.role === "designer" ? x.support_name : x.stylist, type:null }));
      setRows([...mm, ...vv].sort((a,b) => (timeToMinutes(a.time) ?? 9999) - (timeToMinutes(b.time) ?? 9999)));
      setExpenses(e.data || []);
    })();
    return () => { alive = false; };
  }, [date, staff.id, refreshKey]);

  const hasExpense = r => expenses.some(e => r.kind === "meeting" ? e.meeting_id === r.id : e.visit_id === r.id);
  if (rows === null) return <Center><Spinner /></Center>;
  return (
    <div>
      <div className="flex items-baseline justify-between mb-3"><h2 className="text-lg font-semibold">{niceDate(date)}</h2><span className="text-sm text-gray-500">{rows.length} assignment{rows.length === 1 ? "" : "s"}</span></div>
      {rows.length === 0 && <div className="text-center text-gray-500 py-16">Nothing assigned to you on this day.</div>}
      <div className="space-y-3">
        {rows.map(r => (
          <div key={r.kind + r.id} className="bg-white border border-gray-200 rounded-xl shadow-sm p-4">
            <div className="flex items-start justify-between gap-2">
              <div><div className="text-xs font-semibold text-blue-600">{r.time || "Time TBD"} · {r.visit}</div><div className="text-base font-semibold text-gray-900 mt-0.5">{r.customer || "—"}</div></div>
              {r.type && <span className="text-[10px] bg-gray-100 text-gray-600 rounded px-1.5 py-0.5 whitespace-nowrap">{r.type}</span>}
            </div>
            {r.address && <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.address)}`} target="_blank" rel="noopener" className="block text-sm text-gray-700 mt-2 underline decoration-gray-300">📍 {r.address}</a>}
            <div className="flex flex-wrap gap-x-4 gap-y-1 text-sm text-gray-600 mt-2">
              {r.partner && <span>👤 With {r.partner}</span>}
              {r.mobile && <a href={`tel:${r.mobile}`} className="text-blue-600">📞 {r.mobile}</a>}
            </div>
            <div className="mt-3">
              {hasExpense(r)
                ? <div className="text-sm text-green-700 font-medium">✓ Travel expense submitted</div>
                : <button onClick={() => setOpen(r)} className="w-full py-2.5 rounded-lg bg-blue-600 text-white text-sm font-semibold">Add travel expense</button>}
            </div>
          </div>
        ))}
      </div>
      {open && <ExpenseForm staff={staff} date={date} row={open} onClose={() => setOpen(null)} onSaved={() => { setOpen(null); onChanged(); }} />}
    </div>
  );
}

function FileField({ label, files, setFiles }) {
  const [previews, setPreviews] = useState([]);
  useEffect(() => {
    const urls = files.map(f => URL.createObjectURL(f));
    setPreviews(urls);
    return () => urls.forEach(u => URL.revokeObjectURL(u));
  }, [files]);
  const add = e => {
    const picked = Array.from(e.target.files || []);
    if (picked.length) setFiles(prev => [...prev, ...picked]);
    e.target.value = "";
  };
  const removeAt = i => setFiles(prev => prev.filter((_, j) => j !== i));
  return (
    <div>
      <div className="text-xs uppercase tracking-wider text-gray-500 font-semibold mb-1">
        {label}{files.length > 0 && <span className="normal-case tracking-normal text-gray-400"> · {files.length} attached</span>}
      </div>
      {files.length > 0 && (
        <div className="grid grid-cols-3 gap-2 mb-2">
          {previews.map((u, i) => (
            <div key={u} className="relative">
              <img src={u} alt="" className="h-24 w-full object-cover rounded border" />
              <button type="button" onClick={() => removeAt(i)} aria-label="Remove image"
                className="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-red-600 text-white text-sm leading-none shadow">×</button>
            </div>
          ))}
        </div>
      )}
      <label className="block border-2 border-dashed border-gray-300 rounded-lg p-3 text-center text-sm text-gray-600 cursor-pointer active:bg-gray-50">
        <span>{files.length ? "➕ Add more screenshots" : "📷 Tap to attach Rapido screenshots (you can pick several)"}</span>
        <input type="file" accept="image/*" multiple className="hidden" onChange={add} />
      </label>
    </div>
  );
}

function ExpenseForm({ staff, date, row, onClose, onSaved }) {
  const [fareTo, setFareTo] = useState(""); const [filesTo, setFilesTo] = useState([]);
  const [fareBack, setFareBack] = useState(""); const [filesBack, setFilesBack] = useState([]);
  const [method, setMethod] = useState("UPI"); const [note, setNote] = useState("");
  const [busy, setBusy] = useState(false); const [err, setErr] = useState(null);

  const upload = async (file, leg) => {
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
    const path = `${staff.auth_user_id}/${date}/${crypto.randomUUID()}_${leg}.${ext}`;
    const { error } = await supabase.storage.from("invoices").upload(path, file, { contentType: file.type || "image/jpeg", upsert: false });
    if (error) throw new Error("Upload failed: " + error.message);
    return path;
  };
  const submit = async e => {
    e.preventDefault(); setErr(null);
    const a = Number(fareTo), b = Number(fareBack);
    if (!(a > 0) && !(b > 0)) { setErr("Enter at least one fare amount."); return; }
    if (a > 0 && filesTo.length === 0) { setErr("Attach the invoice for the trip to the customer."); return; }
    if (b > 0 && filesBack.length === 0) { setErr("Attach the invoice for the return trip."); return; }
    setBusy(true);
    try {
      const pTo = [];
      for (const f of filesTo) pTo.push(await upload(f, "to"));
      const pBack = [];
      for (const f of filesBack) pBack.push(await upload(f, "back"));
      const { error } = await supabase.from("travel_expenses").insert({
        staff_id: staff.id, staff_name: staff.name, expense_date: date, city: staff.city,
        meeting_id: row.kind === "meeting" ? row.id : null, visit_id: row.kind === "visit" ? row.id : null,
        customer_name: row.customer, fare_to: a || 0, invoice_to_path: pTo[0] || null, invoice_to_paths: pTo, fare_back: b || 0, invoice_back_path: pBack[0] || null, invoice_back_paths: pBack,
        payment_method: method, note: note || null,
      });
      if (error) throw new Error(error.message);
      onSaved();
    } catch (ex) { setErr(ex.message); setBusy(false); }
  };
  return (
    <div className="fixed inset-0 z-50 bg-gray-900/50 flex items-end" onClick={onClose}>
      <form onSubmit={submit} className="bg-white w-full max-h-[94vh] overflow-y-auto rounded-t-2xl" onClick={e => e.stopPropagation()}>
        <div className="sticky top-0 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">
          <div><div className="font-semibold">Travel expense</div><div className="text-xs text-gray-500">{row.customer} · {niceDate(date)}</div></div>
          <button type="button" onClick={onClose} className="w-9 h-9 rounded-full hover:bg-gray-100 text-2xl leading-none text-gray-500">×</button>
        </div>
        {err && <div className="mx-4 mt-3 p-3 rounded-lg bg-red-50 border border-red-200 text-red-800 text-sm">{err}</div>}
        <div className="p-4 space-y-5">
          <div className="space-y-2">
            <label className="block"><span className="text-xs uppercase tracking-wider text-gray-500 font-semibold">Fare — office to customer (₹)</span>
              <input type="number" inputMode="decimal" min="0" step="1" value={fareTo} onChange={e => setFareTo(e.target.value)} className="mt-1 w-full border border-gray-300 rounded-lg px-3 py-3 text-base" /></label>
            <FileField label="Invoices — to customer" files={filesTo} setFiles={setFilesTo} />
          </div>
          <div className="space-y-2">
            <label className="block"><span className="text-xs uppercase tracking-wider text-gray-500 font-semibold">Fare — customer to office (₹)</span>
              <input type="number" inputMode="decimal" min="0" step="1" value={fareBack} onChange={e => setFareBack(e.target.value)} className="mt-1 w-full border border-gray-300 rounded-lg px-3 py-3 text-base" /></label>
            <FileField label="Invoices — return trip" files={filesBack} setFiles={setFilesBack} />
          </div>
          <div>
            <div className="text-xs uppercase tracking-wider text-gray-500 font-semibold mb-2">Paid using</div>
            <div className="grid grid-cols-2 gap-2">
              {["Petty cash","UPI"].map(m => <button type="button" key={m} onClick={() => setMethod(m)} className={`py-3 rounded-lg border text-sm font-semibold ${method === m ? "bg-blue-600 text-white border-blue-600" : "bg-white text-gray-700 border-gray-300"}`}>{m}</button>)}
            </div>
          </div>
          <label className="block"><span className="text-xs uppercase tracking-wider text-gray-500 font-semibold">Note (optional)</span>
            <input value={note} onChange={e => setNote(e.target.value)} className="mt-1 w-full border border-gray-300 rounded-lg px-3 py-3 text-base" /></label>
          <div className="text-sm text-gray-700 bg-gray-50 border border-gray-200 rounded-lg p-3">Total: <b>{inr((Number(fareTo)||0) + (Number(fareBack)||0))}</b> · {method}</div>
        </div>
        <div className="sticky bottom-0 bg-white border-t border-gray-200 p-4 pb-safe">
          <button disabled={busy} className="w-full py-3 rounded-lg bg-blue-600 text-white font-semibold disabled:opacity-60">{busy ? `Uploading ${filesTo.length + filesBack.length} image${filesTo.length + filesBack.length === 1 ? "" : "s"}…` : "Submit expense"}</button>
        </div>
      </form>
    </div>
  );
}

function MyExpenses({ staff, refreshKey }) {
  const [rows, setRows] = useState(null); const [adv, setAdv] = useState([]);
  useEffect(() => {
    (async () => {
      const [e, a] = await Promise.all([
        supabase.from("travel_expenses").select("*").eq("staff_id", staff.id).order("expense_date", { ascending:false }).order("created_at", { ascending:false }).limit(200),
        supabase.from("petty_cash_advances").select("*").eq("staff_id", staff.id),
      ]);
      setRows(e.data || []); setAdv(a.data || []);
    })();
  }, [staff.id, refreshKey]);
  if (rows === null) return <Center><Spinner /></Center>;
  const received = adv.reduce((s,x) => s + Number(x.amount||0), 0);
  const spentCash = rows.filter(r => r.payment_method === "Petty cash").reduce((s,r) => s + Number(r.fare_to||0) + Number(r.fare_back||0), 0);
  const spentUpi = rows.filter(r => r.payment_method === "UPI").reduce((s,r) => s + Number(r.fare_to||0) + Number(r.fare_back||0), 0);
  return (
    <div>
      <div className="grid grid-cols-3 gap-2 mb-4">
        <Stat label="Petty cash received" v={inr(received)} />
        <Stat label="Petty cash spent" v={inr(spentCash)} />
        <Stat label="Balance in hand" v={inr(received - spentCash)} hi />
      </div>
      <div className="text-xs text-gray-500 mb-3">UPI paid by you (to be reimbursed): <b>{inr(spentUpi)}</b></div>
      {rows.length === 0 && <div className="text-center text-gray-500 py-12">No expenses submitted yet.</div>}
      <div className="space-y-3">
        {rows.map(r => (
          <div key={r.id} className="bg-white border border-gray-200 rounded-xl p-3">
            <div className="flex justify-between text-sm"><span className="font-semibold">{r.customer_name || "—"}</span><span className="text-gray-500">{niceDate(r.expense_date)}</span></div>
            <div className="text-sm text-gray-700 mt-1">To {inr(r.fare_to)} · Back {inr(r.fare_back)} · <b>{inr(Number(r.fare_to)+Number(r.fare_back))}</b> · {r.payment_method}</div>
            {[["To", (r.invoice_to_paths && r.invoice_to_paths.length) ? r.invoice_to_paths : (r.invoice_to_path ? [r.invoice_to_path] : [])],
              ["Back", (r.invoice_back_paths && r.invoice_back_paths.length) ? r.invoice_back_paths : (r.invoice_back_path ? [r.invoice_back_path] : [])]]
              .filter(([, ps]) => ps.length > 0)
              .map(([lbl, ps]) => (
                <div key={lbl} className="flex items-center gap-2 mt-2 flex-wrap">
                  <span className="text-[10px] uppercase tracking-wider text-gray-400 w-8">{lbl}</span>
                  {ps.map(p => <a key={p} href={publicUrl(p)} target="_blank" rel="noopener"><img src={publicUrl(p)} className="h-16 w-16 object-cover rounded border" alt={lbl} /></a>)}
                </div>
              ))}
            {r.note && <div className="text-xs text-gray-500 mt-1">{r.note}</div>}
          </div>
        ))}
      </div>
    </div>
  );
}
const Stat = ({ label, v, hi }) => <div className={`rounded-xl p-3 border ${hi ? "bg-blue-50 border-blue-200" : "bg-white border-gray-200"}`}><div className="text-[10px] uppercase tracking-wider text-gray-500">{label}</div><div className="text-base font-bold text-gray-900 mt-0.5">{v}</div></div>;

function ChangePassword({ onClose }) {
  const [p1, setP1] = useState(""); const [p2, setP2] = useState(""); const [msg, setMsg] = useState(null); const [busy, setBusy] = useState(false);
  const submit = async e => {
    e.preventDefault(); setMsg(null);
    if (p1.length < 6) { setMsg({ err:"Password must be at least 6 characters." }); return; }
    if (p1 !== p2) { setMsg({ err:"Passwords don't match." }); return; }
    setBusy(true);
    const { error } = await supabase.auth.updateUser({ password: p1 });
    setBusy(false);
    if (error) setMsg({ err: error.message }); else { setMsg({ ok:"Password changed." }); setTimeout(onClose, 1200); }
  };
  return (
    <div className="fixed inset-0 z-50 bg-gray-900/50 flex items-end" onClick={onClose}>
      <form onSubmit={submit} className="bg-white w-full rounded-t-2xl p-4 pb-safe space-y-3" onClick={e => e.stopPropagation()}>
        <div className="font-semibold">Change password</div>
        <input type="password" placeholder="New password" value={p1} onChange={e => setP1(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-3 text-base" />
        <input type="password" placeholder="Confirm new password" value={p2} onChange={e => setP2(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-3 text-base" />
        {msg?.err && <div className="text-sm text-red-700">{msg.err}</div>}
        {msg?.ok && <div className="text-sm text-green-700">{msg.ok}</div>}
        <button disabled={busy} className="w-full py-3 rounded-lg bg-blue-600 text-white font-semibold disabled:opacity-60">Save</button>
      </form>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
