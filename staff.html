// Shrink photos on the phone before upload: longest side 1600px, JPEG ~72% quality.
// A 4–6 MB camera photo becomes ~200–400 KB; screenshots stay readable. Falls back to the original if the browser can't decode it.
async function compressImage(file, maxSide = 1600, quality = 0.72) {
  try {
    if (!file || !file.type || !file.type.startsWith("image/") || file.type === "image/gif") return file;
    const bmp = await new Promise((res, rej) => { const img = new Image(); const u = URL.createObjectURL(file); img.onload = () => { URL.revokeObjectURL(u); res(img); }; img.onerror = e => { URL.revokeObjectURL(u); rej(e); }; img.src = u; });
    const scale = Math.min(1, maxSide / Math.max(bmp.naturalWidth, bmp.naturalHeight));
    const w = Math.round(bmp.naturalWidth * scale), h = Math.round(bmp.naturalHeight * scale);
    const canvas = document.createElement("canvas"); canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(bmp, 0, 0, w, h);
    const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", quality));
    return blob && blob.size < file.size ? blob : file;
  } catch { return file; }
}

// Build the per-layer checklist from an order: "Living room window 1 — Main / Sheer / Blind"
function checklistFromOrder(order) {
  const items = [];
  (order?.windows || []).forEach((w, i) => {
    const label = `${(w.roomLabel || "Room").trim()} window ${(w.windowIndex ?? i) + 1}`;
    const kind = w.kind || "curtain";
    if (kind === "curtain" || kind === "both") {
      const ct = w.curtain_type || "Main";
      if (ct === "Main" || ct === "Both") items.push({ key: `w${i}-main`, label, layer: "Main" });
      if (ct === "Sheer" || ct === "Both") items.push({ key: `w${i}-sheer`, label, layer: "Sheer" });
    }
    if (kind === "blind" || kind === "both") items.push({ key: `w${i}-blind`, label, layer: "Blind" });
  });
  return items;
}

  const readOnly = existing && (existing.status === "completed" || existing.status === "unfinished");
  const [order, setOrder] = useState(isInstall && row.orderId ? undefined : null);
  const [money, setMoney] = useState(null);   // { total, paid } from accepted estimate + payments
  const [checks, setChecks] = useState(existing?.checklist || {});
  const [details, setDetails] = useState(existing?.details || {});
  const [note, setNote] = useState(existing?.note || "");
  const [files, setFiles] = useState([]);
  const [mode, setMode] = useState(null); // null | "unfinished"
  const [reason, setReason] = useState(existing?.unfinished_reason || "");
  const [busy, setBusy] = useState(false); const [err, setErr] = useState(null);
  const [savedTick, setSavedTick] = useState(false);
  const [dispatch, setDispatch] = useState(isInstall ? undefined : null);   // factory pick-up approval
  const loadDispatch = () => supabase.from("factory_dispatches").select("*").eq("visit_id", row.id).eq("kind", "dispatch").maybeSingle().then(({ data }) => setDispatch(data || null));
  useEffect(() => { if (isInstall) loadDispatch(); }, [row.id]);
  const dispStatus = dispatch?.status || "pending";
  const blocked = isInstall && !readOnly && (dispatch === undefined || dispStatus === "pending" || dispStatus === "not_ready");
  const notDispatched = (dispatch?.items || []).filter(i => i.state !== "ready");
  useEffect(() => {
    history.pushState({ jobSheet: true }, "");
    const onPop = () => onClose();
    window.addEventListener("popstate", onPop);
    return () => { window.removeEventListener("popstate", onPop); if (history.state && history.state.jobSheet) history.back(); };
  }, []);

  useEffect(() => {
    if (!(isInstall && row.orderId)) return;
    supabase.from("customer_orders").select("id,customer_name,customer_mobile,client_id,customer_building_name,customer_landmark,customer_city,designer_name,windows_count,windows,rooms,advance_amount,balance_amount,balance_paid,special_note,status")
      .eq("id", row.orderId).single().then(({ data }) => setOrder(data || null));
    (async () => {
      const [e, p] = await Promise.all([
        supabase.from("estimates").select("total,status,version,generated_at").eq("customer_order_id", row.orderId),
        supabase.from("customer_payments").select("amount").eq("customer_order_id", row.orderId),
      ]);
      const ests = e.data || [];
      const acc = ests.find(x => x.status === "accepted")
        || ests.filter(x => !["superseded","rejected"].includes(x.status)).sort((a,b) => (b.version||0) - (a.version||0) || String(b.generated_at).localeCompare(String(a.generated_at)))[0];
      const paid = (p.data || []).reduce((t, x) => t + (Number(x.amount) || 0), 0);
      setMoney({ total: acc ? Number(acc.total) : null, paid });
    })();
  }, [row.orderId]);

  // Only the curtains the office selected for this visit; fall back to the whole order for older visits
  const allItems = useMemo(() => (Array.isArray(row.installItems) && row.installItems.length) ? row.installItems : checklistFromOrder(order), [order, row.installItems]);
  // Only curtains the factory actually released go on the checklist
  const items = useMemo(() => {
    const rel = (dispatch?.items || []);
    if (!rel.length || rel.some(i => i.key === "all")) return allItems;
    const ok = new Set(rel.filter(i => i.state === "ready").map(i => i.key));
    return allItems.filter(i => ok.has(i.key));
  }, [allItems, dispatch]);
  const ticked = items.filter(i => checks[i.key]).length;
  const orderTotal = money?.total ?? null;
  const tools = useMemo(() => orderTotal != null && orderTotal >= CARE_KIT_MIN ? [...INSTALL_TOOLS, CARE_KIT] : INSTALL_TOOLS, [orderTotal]);
  const toolPhotos = details.tool_photos || {};
  const toolDone = t => (toolPhotos[t.key] || []).length > 0;
  const toolsTicked = tools.filter(toolDone).length;
  const [toolBusy, setToolBusy] = useState(null);
  // Each tool needs a photo as proof it is being carried; uploaded straight away so it is never lost
  const uploadToolPhoto = async (t, file) => {
    if (!file) return;
    setToolBusy(t.key); setErr(null);
    try {
      const blob = await compressImage(file); const ext = uploadExt(file, blob);
      const path = `${staff.auth_user_id}/jobs/${row.id}/tools/${t.key}_${crypto.randomUUID()}.${ext}`;
      const { error } = await supabase.storage.from("invoices").upload(path, blob, { contentType: blob.type || file.type || "image/jpeg" });
      if (error) throw new Error("Photo upload failed: " + error.message);
      setDetails(d => ({ ...d, tool_photos: { ...(d.tool_photos || {}), [t.key]: [path] } }));
      setChecks(c => ({ ...c, [t.key]: true }));
    } catch (ex) { setErr(ex.message); } finally { setToolBusy(null); }
  };
  // Balance: trust the order's own fields when filled, otherwise accepted estimate minus payments received
  const balance = !order ? null
    : order.balance_paid ? 0
    : order.balance_amount != null ? Number(order.balance_amount)
    : orderTotal != null ? Math.max(0, Math.round(orderTotal - (money?.paid || 0)))
    : null;
  const setD = k => e => setDetails(d => ({ ...d, [k]: e.target.value }));

  const persist = async (patch) => {
    const base = { staff_id: staff.id, staff_name: staff.name, job_kind: "visit", job_id: row.id, job_type: vt, job_date: date,
      order_id: row.orderId || null, client_id: row.clientId || null, customer_name: row.customer || null,
      checklist: checks, details, note: note || null, updated_at: new Date().toISOString(), ...patch };
    if (!existing && !patch.started_at) base.started_at = new Date().toISOString();
    const { error } = await supabase.from("job_completions").upsert(base, { onConflict: "job_kind,job_id" });
    if (error) throw new Error(error.message);
  };
  // Auto-save ticks (debounced) so progress isn't lost if the phone locks
  useEffect(() => {
    if (readOnly || (!existing && Object.keys(checks).length === 0)) return;
    const t = setTimeout(() => persist({ status: "in_progress" }).then(() => { setSavedTick(true); setTimeout(() => setSavedTick(false), 1200); }).catch(() => {}), 600);
    return () => clearTimeout(t);
  }, [checks, details.tool_photos]);

  const uploadAll = async () => {
    const paths = [];
    for (const f of files) {
      const blob = await compressImage(f); const ext = uploadExt(f, blob);
      const path = `${staff.auth_user_id}/jobs/${row.id}/${crypto.randomUUID()}.${ext}`;
      const { error } = await supabase.storage.from("invoices").upload(path, blob, { contentType: blob.type || f.type || "image/jpeg" });
      if (error) throw new Error("Photo upload failed: " + error.message);
      paths.push(path);
    }
    return [...(existing?.photos || []), ...paths];
  };
  const validate = () => {
    if (isInstall && toolsTicked < tools.length) return `Add a photo for every tool you are carrying. Missing: ${tools.filter(t => !toolDone(t)).map(t => t.label).join(", ")}.`;
    if (isInstall && items.length && ticked < items.length) return `Tick all ${items.length} curtains before marking complete (or choose "Could not finish").`;
    if (vt === "Measurement" && files.length === 0 && !(existing?.photos || []).length) return "Attach at least one measurement photo.";
    if (vt === "Cash collection") { if (!(Number(details.amount) > 0)) return "Enter the amount collected."; if (!details.mode) return "Select how the customer paid."; }
    if (vt === "Collection for alteration" && !(Number(details.pieces) > 0)) return "Enter how many pieces you collected.";
    if ((vt === "Upholstery" || vt === "Ironing") && !(Number(details.pieces) > 0)) return "Enter how many pieces were done.";
    if (files.length === 0 && !(existing?.photos || []).length && vt !== "Cash collection") return "Photos of the finished work are mandatory — add at least one.";
    if (isInstall && !details.feedback) return "Tell us if the customer filled the feedback form (Yes / No).";
    return null;
  };
  const finish = async (status) => {
    setErr(null);
    if (status === "completed") { const v = validate(); if (v) { setErr(v); return; } }
    if (status === "unfinished" && !reason.trim()) { setErr("Tell the office why the job couldn't be finished."); return; }
    setBusy(true);
    try {
      const photos = await uploadAll();
      await persist({ status, photos, completed_at: new Date().toISOString(), unfinished_reason: status === "unfinished" ? reason.trim() : null });
      await supabase.from("field_visits").update({ status: status === "completed" ? "Completed" : "Unfinished" }).eq("id", row.id);
      onSaved();
    } catch (ex) { setErr(ex.message); setBusy(false); }
  };

  const inp = "mt-1 w-full border border-gray-300 rounded-lg px-3 py-3 text-base disabled:bg-gray-50";
  const addr = order ? [order.customer_building_name, order.customer_landmark, order.customer_city].filter(Boolean).join(", ") : row.address;

  return (
    <div className="fixed inset-0 z-50 bg-gray-900/50 flex items-end" onClick={onClose}>
      <div className="bg-white w-full max-h-[94vh] overflow-y-auto rounded-t-2xl" onClick={e => e.stopPropagation()}>
        <div className="sticky top-0 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between z-10">
          <div className="flex items-center gap-2 min-w-0">
            <button type="button" onClick={onClose} aria-label="Back" className="shrink-0 inline-flex items-center gap-1 pl-1 pr-3 h-9 rounded-full hover:bg-gray-100 active:bg-gray-200 text-blue-600 font-semibold text-sm">
              <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M15 18l-6-6 6-6" /></svg>Back
            </button>
            <div className="min-w-0"><div className="font-semibold truncate">{vt} · job sheet</div><div className="text-xs text-gray-500 truncate">{row.customer} · {niceDate(date)}{savedTick && <span className="ml-2 text-green-600">saved ✓</span>}</div></div>
          </div>
        </div>
        {err && <div className="mx-4 mt-3 p-3 rounded-lg bg-red-50 border border-red-200 text-red-800 text-sm">{err}</div>}
        {readOnly && <div className={`mx-4 mt-3 p-3 rounded-lg text-sm ${existing.status === "completed" ? "bg-green-50 border border-green-200 text-green-800" : "bg-amber-50 border border-amber-200 text-amber-800"}`}>
          {existing.status === "completed" ? "Marked complete" : "Marked unfinished"} on {new Date(existing.completed_at).toLocaleString("en-IN")}{existing.unfinished_reason ? ` — ${existing.unfinished_reason}` : ""}</div>}
        <div className="p-4 space-y-5">
          {/* Customer */}
          <section className="rounded-xl border border-gray-200 p-3">
            <div className="text-xs uppercase tracking-wider text-gray-500 font-semibold mb-1">Customer</div>
            <div className="font-semibold text-gray-900">{row.customer}{row.clientId && <span className="ml-2 font-mono text-xs text-blue-700">{row.clientId}</span>}</div>
            {addr && <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}`} target="_blank" rel="noopener" className="block text-sm text-gray-700 mt-1 underline decoration-gray-300">📍 {addr}</a>}
            {(row.mobile || order?.customer_mobile) && <a href={`tel:${row.mobile || order.customer_mobile}`} className="block text-sm text-blue-600 mt-1">📞 {row.mobile || order.customer_mobile}</a>}
            {row.partner && <div className="text-sm text-gray-600 mt-1">👤 Stylist: {row.partner}</div>}
          </section>

          {isInstall && !readOnly && (dispatch === undefined ? <Center><Spinner /></Center> : blocked ? (
            <section className={`rounded-xl border-2 p-4 text-center ${dispStatus === "not_ready" ? "border-red-300 bg-red-50" : "border-yellow-300 bg-yellow-50"}`}>
              <div className="text-3xl">{dispStatus === "not_ready" ? "⛔" : "⏳"}</div>
              <div className="font-semibold text-gray-900 mt-1">{dispStatus === "not_ready" ? "Factory says the items are not ready" : "Waiting for factory dispatch approval"}</div>
              <div className="text-sm text-gray-700 mt-1">{dispStatus === "not_ready" ? "Do not pick up. Please call the office." : "Don't pick up the curtains yet. The job sheet opens once the factory approves the dispatch."}</div>
              {notDispatched.length > 0 && <div className="text-left text-sm mt-3 space-y-1">{notDispatched.map(i => <div key={i.key} className="text-red-700">✗ {i.label} {i.layer}{i.reason ? ` — ${i.reason}` : ""}</div>)}</div>}
              {dispatch?.note && <div className="text-xs text-amber-800 mt-2">{dispatch.note}</div>}
              <button onClick={loadDispatch} className="mt-3 px-4 py-2 rounded-lg bg-white border border-gray-300 text-sm font-semibold">↻ Check again</button>
            </section>
          ) : (
            <section className="rounded-xl border border-green-300 bg-green-50 p-3 text-sm text-green-800">
              ✅ <b>{dispStatus === "partial" ? "Partly approved" : "Dispatch approved"}</b> by {dispatch.approved_by} · {new Date(dispatch.approved_at).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" })}. Pick up the items below.
              {notDispatched.length > 0 && <div className="mt-2 text-amber-800">Not released by factory: {notDispatched.map(i => `${i.label} ${i.layer}${i.reason ? ` (${i.reason})` : ""}`).join(", ")} — the office will schedule these separately.</div>}
            </section>
          ))}

          {!blocked && <>
          {/* Installation: order summary + checklist */}
          {isInstall && (order === undefined ? <Center><Spinner /></Center> : !order ? (
            <div className="rounded-xl border border-amber-200 bg-amber-50 p-3 text-sm text-amber-800">No order is linked to this visit, so the curtain checklist isn't available. Please ask the office to link the order. You can still mark the job complete with photos.</div>
          ) : (
            <>
              <section className="rounded-xl border border-gray-200 p-3">
                <div className="text-xs uppercase tracking-wider text-gray-500 font-semibold mb-1">Order summary</div>
                <div className="grid grid-cols-2 gap-y-1 text-sm">
                  <div className="text-gray-500">Order</div><div className="font-medium">#{order.id}</div>
                  <div className="text-gray-500">Windows</div><div className="font-medium">{order.windows_count ?? (order.windows || []).length}</div>
                  <div className="text-gray-500">Curtain items</div><div className="font-medium">{items.length}</div>
                  {orderTotal != null && <><div className="text-gray-500">Order value</div><div className="font-medium">{inr(orderTotal)}</div></>}
                  <div className="text-gray-500">Balance due</div>
                  <div className={`font-bold ${money === null && order.balance_amount == null && !order.balance_paid ? "text-gray-400" : balance == null ? "text-gray-500" : balance > 0 ? "text-red-700" : "text-green-700"}`}>
                    {money === null && order.balance_amount == null && !order.balance_paid ? "…" : balance == null ? "Check with office" : balance > 0 ? inr(balance) + " to collect" : "Paid ✓"}</div>
                </div>
                {order.special_note && <div className="mt-2 text-sm bg-yellow-50 border border-yellow-200 rounded-lg p-2 text-yellow-900">📝 {order.special_note}</div>}
              </section>
              <section className="rounded-xl border border-gray-200 p-3">
                <div className="flex items-baseline justify-between mb-1"><div className="text-xs uppercase tracking-wider text-gray-500 font-semibold">Tools to carry <span className="text-red-600">· photo of each required</span></div><div className={`text-xs font-semibold ${toolsTicked === tools.length ? "text-green-700" : "text-gray-700"}`}>{toolsTicked}/{tools.length}</div></div>
                <div className="divide-y divide-gray-100">
                  {tools.map(t => { const ph = toolPhotos[t.key] || []; const ok = ph.length > 0; return (
                    <div key={t.key} className="flex items-center gap-3 py-2.5">
                      <span className={`w-6 h-6 rounded-full shrink-0 inline-flex items-center justify-center text-xs font-bold ${ok ? "bg-green-600 text-white" : "border-2 border-gray-300"}`}>{ok ? "✓" : ""}</span>
                      <span className="flex-1 text-base text-gray-900">{t.label}{t.key === CARE_KIT.key && <span className="ml-2 text-[11px] font-semibold text-purple-700 bg-purple-50 border border-purple-200 rounded px-1.5 py-0.5">Give to customer</span>}</span>
                      {ok && <a href={jobPhotoUrl(ph[0])} target="_blank" rel="noopener"><img src={jobPhotoUrl(ph[0])} alt={t.label} className="h-12 w-12 object-cover rounded border" /></a>}
                      {!readOnly && (
                        <label className={`shrink-0 px-3 py-2 rounded-lg text-sm font-semibold cursor-pointer ${ok ? "border border-gray-300 text-gray-700" : "bg-blue-600 text-white"} ${toolBusy === t.key ? "opacity-60" : ""}`}>
                          {toolBusy === t.key ? "Uploading…" : ok ? "Retake" : "📷 Photo"}
                          <input type="file" accept="image/*" capture="environment" className="hidden" disabled={!!toolBusy} onChange={e => { const f = e.target.files && e.target.files[0]; e.target.value = ""; uploadToolPhoto(t, f); }} />
                        </label>)}
                    </div>); })}
                </div>
              </section>
              <section className="rounded-xl border border-gray-200 p-3">
                <div className="flex items-baseline justify-between mb-2"><div className="text-xs uppercase tracking-wider text-gray-500 font-semibold">Installation checklist</div><div className="text-xs font-semibold text-gray-700">{ticked}/{items.length}</div></div>
                <div className="h-1.5 bg-gray-100 rounded-full mb-3"><div className="h-1.5 bg-green-500 rounded-full transition-all" style={{ width: `${items.length ? ticked/items.length*100 : 0}%` }} /></div>
                <div className="divide-y divide-gray-100">
                  {items.map(it => (
                    <label key={it.key} className={`flex items-center gap-3 py-3 ${readOnly ? "" : "active:bg-gray-50"}`}>
                      <input type="checkbox" disabled={readOnly} checked={!!checks[it.key]} onChange={e => setChecks(c => ({ ...c, [it.key]: e.target.checked }))} className="w-6 h-6 accent-green-600 shrink-0" />
                      <span className={`text-base ${checks[it.key] ? "line-through text-gray-400" : "text-gray-900"}`}>{it.label} <b>{it.layer}</b></span>
                    </label>
                  ))}
                  {items.length === 0 && <div className="text-sm text-gray-500 py-2">This order has no curtain or blind items.</div>}
                </div>
              </section>
            </>
          ))}

          {/* Maintenance-type specific fields */}
          {vt === "Cash collection" && (
            <section className="rounded-xl border border-gray-200 p-3 space-y-3">
              <Field label="Amount collected (₹)"><input type="number" inputMode="decimal" min="0" disabled={readOnly} value={details.amount || ""} onChange={setD("amount")} className={inp} /></Field>
              <div><div className="text-xs uppercase tracking-wider text-gray-500 font-semibold mb-2">Paid by</div>
                <div className="grid grid-cols-3 gap-2">{["Cash","UPI","Cheque"].map(m => <button type="button" key={m} disabled={readOnly} onClick={() => setDetails(d => ({ ...d, mode: m }))} className={`py-3 rounded-lg border text-sm font-semibold ${details.mode === m ? "bg-blue-600 text-white border-blue-600" : "bg-white text-gray-700 border-gray-300"}`}>{m}</button>)}</div></div>
              <Field label="Receipt / reference no. (optional)"><input disabled={readOnly} value={details.ref || ""} onChange={setD("ref")} className={inp} /></Field>
            </section>
          )}
          {vt === "Collection for alteration" && (
            <section className="rounded-xl border border-gray-200 p-3 space-y-3">
              <Field label="Pieces collected"><input type="number" inputMode="numeric" min="0" disabled={readOnly} value={details.pieces || ""} onChange={setD("pieces")} className={inp} /></Field>
              <Field label="What needs altering?"><textarea rows="3" disabled={readOnly} value={details.reason || ""} onChange={setD("reason")} className={inp} placeholder="e.g. Living room main curtain 2 inch too long" /></Field>
            </section>
          )}
          {(vt === "Upholstery" || vt === "Ironing") && (
            <section className="rounded-xl border border-gray-200 p-3 space-y-3">
              <Field label="Pieces done"><input type="number" inputMode="numeric" min="0" disabled={readOnly} value={details.pieces || ""} onChange={setD("pieces")} className={inp} /></Field>
              <Field label="Rooms / items (optional)"><input disabled={readOnly} value={details.items || ""} onChange={setD("items")} className={inp} placeholder="e.g. Living room sofa, 2 chairs" /></Field>
            </section>
          )}
          {vt === "Track installation" && (
            <section className="rounded-xl border border-gray-200 p-3 space-y-3">
              <Field label="Tracks installed"><input type="number" inputMode="numeric" min="0" disabled={readOnly} value={details.pieces || ""} onChange={setD("pieces")} className={inp} /></Field>
            </section>
          )}

          {/* Photos + note */}
          <section className="rounded-xl border border-gray-200 p-3 space-y-3">
            {(existing?.photos || []).length > 0 && (
              <div><div className="text-xs uppercase tracking-wider text-gray-500 font-semibold mb-1">Photos submitted</div>
                <div className="grid grid-cols-3 gap-2">{existing.photos.map(p => <a key={p} href={jobPhotoUrl(p)} target="_blank" rel="noopener"><img src={jobPhotoUrl(p)} className="h-24 w-full object-cover rounded border" /></a>)}</div></div>
            )}
            {!readOnly && <FileField label={vt === "Measurement" ? "Measurement photos * (required)" : vt === "Cash collection" ? "Receipt photo (optional)" : "Photos of finished work * (required)"} files={files} setFiles={setFiles} hint="📷 Tap to add photos" />}
            <Field label="Note for office (optional)"><textarea rows="2" disabled={readOnly} value={note} onChange={e => setNote(e.target.value)} className={inp} /></Field>
          </section>

          {isInstall && (
            <section className="rounded-xl border border-gray-200 p-3">
              <div className="text-xs uppercase tracking-wider text-gray-500 font-semibold">Customer feedback</div>
              <div className="text-sm text-gray-600 mt-1">Ask the customer to scan this QR code and fill the feedback form.</div>
              <div className="flex justify-center my-3"><img src={FEEDBACK_QR} alt="Customer feedback form QR code" className="w-56 h-56 border border-gray-200 rounded-lg p-2 bg-white" style={{ imageRendering: "pixelated" }} /></div>
              <a href={FEEDBACK_URL} target="_blank" rel="noopener" className="block text-center text-sm text-blue-600 underline mb-3">Or open the form on this phone</a>
              <div className="text-sm font-semibold text-gray-900 mb-2">Has the customer given feedback?</div>
              <div className="grid grid-cols-2 gap-2">
                {["Yes","No"].map(v => (
                  <button type="button" key={v} disabled={readOnly} onClick={() => setDetails(d => ({ ...d, feedback: v }))}
                    className={`py-3 rounded-lg border text-sm font-semibold ${details.feedback === v ? (v === "Yes" ? "bg-green-600 text-white border-green-600" : "bg-amber-500 text-white border-amber-500") : "bg-white text-gray-700 border-gray-300"}`}>{v === "Yes" ? "Yes, given ✓" : "No"}</button>
                ))}
              </div>
              {details.feedback === "No" && (
                <input disabled={readOnly} value={details.feedback_reason || ""} onChange={setD("feedback_reason")} placeholder="Why not? (optional) e.g. customer busy, will fill later" className={inp + " mt-2"} />
              )}
            </section>
          )}

          {!readOnly && mode === "unfinished" && (
            <section className="rounded-xl border border-amber-300 bg-amber-50 p-3">
              <Field label="Why couldn't the job be finished?"><textarea rows="3" value={reason} onChange={e => setReason(e.target.value)} className={inp} placeholder="e.g. Customer not at home / 2 curtains short / wrong size" /></Field>
            </section>
          )}
          </>}
        </div>
        {!readOnly && !blocked && (
          <div className="sticky bottom-0 bg-white border-t border-gray-200 p-4 pb-safe grid grid-cols-2 gap-2">
            {mode === "unfinished"
              ? <><button type="button" disabled={busy} onClick={() => setMode(null)} className="py-3 rounded-lg border border-gray-300 text-gray-700 font-semibold">Back</button>
                  <button type="button" disabled={busy} onClick={() => finish("unfinished")} className="py-3 rounded-lg bg-amber-500 text-white font-semibold disabled:opacity-60">{busy ? "Saving…" : "Submit as unfinished"}</button></>
              : <><button type="button" disabled={busy} onClick={() => setMode("unfinished")} className="py-3 rounded-lg border border-amber-400 text-amber-700 font-semibold">Could not finish</button>
                  <button type="button" disabled={busy} onClick={() => finish("completed")} className="py-3 rounded-lg bg-green-600 text-white font-semibold disabled:opacity-60">{busy ? `Uploading ${files.length} photo${files.length === 1 ? "" : "s"}…` : "Mark complete ✓"}</button></>}
          </div>
        )}
      </div>

function useFactoryVisits(date, type, tick) {
  const [state, setState] = useState(null);
  useEffect(() => {
    let alive = true; setState(null);
    (async () => {
      const v = await supabase.from("field_visits").select("*").eq("visit_date", date).eq("visit_type", type).is("deleted_at", null);
      const visits = (v.data || []).sort((a, b) => (timeToMinutes(a.timing) ?? 9999) - (timeToMinutes(b.timing) ?? 9999));
      const ids = visits.map(x => x.id);
      const orderIds = Array.from(new Set(visits.map(x => x.order_id).filter(Boolean)));
      const names = Array.from(new Set(visits.map(x => x.support_name).filter(Boolean)));
      const [d, o, s] = await Promise.all([
        ids.length ? supabase.from("factory_dispatches").select("*").in("visit_id", ids) : Promise.resolve({ data: [] }),
        orderIds.length ? supabase.from("customer_orders").select("id,windows,customer_city,special_note").in("id", orderIds) : Promise.resolve({ data: [] }),
        names.length ? supabase.from("staff").select("name,mobile").in("name", names) : Promise.resolve({ data: [] }),
      ]);
      if (!alive) return;
      setState({ visits, disp: Object.fromEntries((d.data || []).map(x => [x.visit_id, x])), orders: Object.fromEntries((o.data || []).map(x => [x.id, x])), phones: Object.fromEntries((s.data || []).map(x => [x.name, x.mobile])) });
    })();
    return () => { alive = false; };
  }, [date, type, tick]);
  return state;
}

function FactoryDispatch({ staff, date }) {

  if (!st) return <Center><Spinner /></Center>;

function DispatchCard({ staff, v, order, disp, phone, onSaved }) {
  const items = dispatchItemsFor(v, order);
  const saved = disp && disp.status !== "pending" && Array.isArray(disp.items);
  const [editing, setEditing] = useState(!saved);
  const [marks, setMarks] = useState(() => Object.fromEntries((disp?.items || []).map(i => [i.key, { state: i.state, reason: i.reason || "" }])));
  const [busy, setBusy] = useState(false); const [err, setErr] = useState(null);
  const ui = DISPATCH_UI[disp?.status || "pending"];
  const set = (k, patch) => setMarks(m => ({ ...m, [k]: { ...(m[k] || {}), ...patch } }));
  const allReady = () => setMarks(Object.fromEntries(items.map(i => [i.key, { state: "ready", reason: "" }])));
  const submit = async () => {
    if (items.some(i => !marks[i.key]?.state)) { setErr("Mark every item as Ready or Not ready."); return; }
    if (items.some(i => marks[i.key].state === "not_ready" && !(marks[i.key].reason || "").trim())) { setErr("Give a reason for each item that is not ready."); return; }
    const out = items.map(i => ({ key: i.key, label: i.label, layer: i.layer || "", state: marks[i.key].state, reason: marks[i.key].state === "not_ready" ? marks[i.key].reason.trim() : null }));
    const nReady = out.filter(i => i.state === "ready").length;
    const status = nReady === out.length ? "approved" : nReady === 0 ? "not_ready" : "partial";
    setBusy(true); setErr(null);
    const { error } = await supabase.from("factory_dispatches").upsert({ visit_id: v.id, kind: "dispatch", status, items: out, note: null, approved_by: staff.name, approved_at: new Date().toISOString(), updated_at: new Date().toISOString() }, { onConflict: "visit_id" });
    setBusy(false);
    if (error) { setErr(error.message); return; }
    setEditing(false); onSaved();
  };
  return (
    <div className={`bg-white border rounded-xl shadow-sm p-4 ${disp?.status === "approved" ? "border-green-300" : disp?.status === "not_ready" ? "border-red-300" : disp?.status === "partial" ? "border-amber-300" : "border-gray-200"}`}>
      <div className="flex items-start justify-between gap-2">
        <div className="min-w-0">
          <div className="text-xs font-semibold text-blue-600">{v.timing || "Time TBD"} · {v.city || "Mumbai"}</div>
          <div className="text-base font-semibold text-gray-900">{v.customer_name || "—"}</div>
          <div className="text-[11px] text-gray-600">{v.client_id && <span className="font-mono font-semibold text-blue-700 mr-2">{v.client_id}</span>}{v.order_id ? `Order #${v.order_id}` : "No order linked"}</div>
        </div>
        <span className={`text-[10px] font-semibold rounded px-1.5 py-0.5 whitespace-nowrap ${ui[1]}`}>{ui[0]}</span>
      </div>
      <div className="text-sm text-gray-700 mt-2">🚚 Pick-up by <b>{v.support_name || "— not assigned —"}</b>{phone && <a href={`tel:${phone}`} className="text-blue-600 ml-2">📞 {phone}</a>}</div>
      {order?.special_note && <div className="mt-2 text-sm bg-yellow-50 border border-yellow-200 rounded-lg p-2 text-yellow-900">📝 {order.special_note}</div>}
      {disp?.note && disp.status === "pending" && <div className="mt-2 text-xs text-amber-700">{disp.note}</div>}
      {err && <div className="mt-2 p-2 rounded-lg bg-red-50 border border-red-200 text-red-800 text-sm">{err}</div>}

      {!editing ? (
        <div className="mt-3">
          <div className="divide-y divide-gray-100">{(disp.items || []).map(i => (
            <div key={i.key} className="py-2 flex items-start gap-2 text-sm">
              <span className={`mt-0.5 ${i.state === "ready" ? "text-green-600" : "text-red-600"}`}>{i.state === "ready" ? "✓" : "✗"}</span>
              <div><span className="text-gray-900">{i.label} <b>{i.layer}</b></span>{i.reason && <div className="text-xs text-red-700">{i.reason}</div>}</div>
            </div>))}</div>
          <div className="text-[11px] text-gray-500 mt-1">By {disp.approved_by} · {new Date(disp.approved_at).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" })}</div>
          <button onClick={() => setEditing(true)} className="mt-2 w-full py-2 rounded-lg border border-gray-300 text-sm font-semibold text-gray-700">Change</button>
        </div>
      ) : (
        <div className="mt-3">
          <div className="flex items-center justify-between mb-1"><div className="text-xs uppercase tracking-wider text-gray-500 font-semibold">Items to hand over ({items.length})</div><button onClick={allReady} className="text-xs font-semibold text-green-700">All ready</button></div>
          <div className="divide-y divide-gray-100">
            {items.map(i => { const m = marks[i.key] || {}; return (
              <div key={i.key} className="py-2.5">
                <div className="flex items-center gap-2">
                  <span className="flex-1 text-sm text-gray-900">{i.label} <b>{i.layer}</b></span>
                  <button onClick={() => set(i.key, { state: "ready" })} className={`px-3 py-1.5 rounded-lg text-xs font-semibold border ${m.state === "ready" ? "bg-green-600 text-white border-green-600" : "bg-white text-gray-700 border-gray-300"}`}>✓ Ready</button>
                  <button onClick={() => set(i.key, { state: "not_ready" })} className={`px-3 py-1.5 rounded-lg text-xs font-semibold border ${m.state === "not_ready" ? "bg-red-600 text-white border-red-600" : "bg-white text-gray-700 border-gray-300"}`}>✗ Not ready</button>
                </div>
                {m.state === "not_ready" && <input value={m.reason || ""} onChange={e => set(i.key, { reason: e.target.value })} placeholder="Reason, e.g. still in stitching" className="mt-2 w-full border border-red-200 rounded-lg px-3 py-2 text-sm" />}
              </div>); })}
          </div>
          <div className="grid grid-cols-2 gap-2 mt-2">
            {saved && <button onClick={() => setEditing(false)} className="py-2.5 rounded-lg border border-gray-300 text-sm font-semibold text-gray-700">Cancel</button>}
            <button disabled={busy} onClick={submit} className={`${saved ? "" : "col-span-2"} py-2.5 rounded-lg bg-gray-900 text-white text-sm font-semibold disabled:opacity-60`}>{busy ? "Saving…" : "Submit dispatch approval"}</button>
          </div>
        </div>
      )}
    </div>
  );
}

            <span className={`text-[10px] font-semibold rounded px-1.5 py-0.5 ${cu[1]}`}>{cu[0]}</span></div>
          <div className="mt-2 divide-y divide-gray-100">{iss.map(i => (

              <input type="checkbox" checked={i.status === "resolved"} onChange={() => toggleIssue(i)} className="mt-1 w-5 h-5 accent-green-600" />
              <div className="min-w-0"><div className={`text-sm font-semibold ${i.status === "resolved" ? "line-through text-gray-400" : ""}`}>{i.item_label}{i.layer ? ` · ${i.layer}` : ""} <span className="text-xs text-red-700">({i.issue_type})</span></div>
                {i.description && <div className="text-sm text-gray-700">{i.description}</div>}

            {(c.status === "open" || c.status === "in_progress") && <button onClick={() => { if (confirm("Mark this alteration as done and ready to send back?")) setCase(c, "resolved"); }} className="py-2 rounded-lg bg-green-600 text-white text-sm font-semibold">Done ✓</button>}
          </div>
        </div>); })}</div>
    </div>
  );
}

function FileField({ label, files, setFiles, hint }) {
  const [previews, setPreviews] = useState([]);
  useEffect(() => {
    const urls = files.map(f => URL.createObjectURL(f));
    setPreviews(urls);
    return () => urls.forEach(u => URL.revokeObjectURL(u));
  }, [files]);
  const add = e => {
    const picked = Array.from(e.target.files || []);
    if (picked.length) setFiles(prev => [...prev, ...picked]);
    e.target.value = "";
  };
  const removeAt = i => setFiles(prev => prev.filter((_, j) => j !== i));
  return (
    <div>
      <div className="text-xs uppercase tracking-wider text-gray-500 font-semibold mb-1">
        {label}{files.length > 0 && <span className="normal-case tracking-normal text-gray-400"> · {files.length} attached</span>}

      {files.length > 0 && (
        <div className="grid grid-cols-3 gap-2 mb-2">

            <div key={u} className="relative">

}

function ExpenseForm({ staff, date, row, onClose, onSaved }) {
  const [fareTo, setFareTo] = useState(""); const [filesTo, setFilesTo] = useState([]);
  const [fareBack, setFareBack] = useState(""); const [filesBack, setFilesBack] = useState([]);
  const [method, setMethod] = useState("UPI"); const [note, setNote] = useState("");
  const [busy, setBusy] = useState(false); const [err, setErr] = useState(null);

  const upload = async (file, leg) => {
    const blob = await compressImage(file); const ext = uploadExt(file, blob);
    const path = `${staff.auth_user_id}/${date}/${crypto.randomUUID()}_${leg}.${ext}`;
    const { error } = await supabase.storage.from("invoices").upload(path, blob, { contentType: blob.type || file.type || "image/jpeg", upsert: false });
    if (error) throw new Error("Upload failed: " + error.message);
    return path;
  };
  const submit = async e => {
    e.preventDefault(); setErr(null);
    const a = Number(fareTo), b = Number(fareBack);
    if (!(a > 0) && !(b > 0)) { setErr("Enter at least one fare amount."); return; }
    if (a > 0 && filesTo.length === 0) { setErr("Attach the invoice for the trip to the customer."); return; }
    if (b > 0 && filesBack.length === 0) { setErr("Attach the invoice for the return trip."); return; }
    setBusy(true);
    try {
      const pTo = [];
      for (const f of filesTo) pTo.push(await upload(f, "to"));
      const pBack = [];
      for (const f of filesBack) pBack.push(await upload(f, "back"));
      const { error } = await supabase.from("travel_expenses").insert({
        staff_id: staff.id, staff_name: staff.name, expense_date: date, city: staff.city,
        meeting_id: row.kind === "meeting" ? row.id : null, visit_id: row.kind === "visit" ? row.id : null,
        customer_name: row.customer, fare_to: a || 0, invoice_to_path: pTo[0] || null, invoice_to_paths: pTo, fare_back: b || 0, invoice_back_path: pBack[0] || null, invoice_back_paths: pBack,
        payment_method: method, note: note || null,
      });
      if (error) throw new Error(error.message);
      onSaved();
    } catch (ex) { setErr(ex.message); setBusy(false); }
  };
  return (
    <div className="fixed inset-0 z-50 bg-gray-900/50 flex items-end" onClick={onClose}>
      <form onSubmit={submit} className="bg-white w-full max-h-[94vh] overflow-y-auto rounded-t-2xl" onClick={e => e.stopPropagation()}>
        <div className="sticky top-0 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">
          <div><div className="font-semibold">Travel expense</div><div className="text-xs text-gray-500">{row.customer} · {niceDate(date)}</div></div>
          <button type="button" onClick={onClose} className="w-9 h-9 rounded-full hover:bg-gray-100 text-2xl leading-none text-gray-500">×</button>
        </div>
        {err && <div className="mx-4 mt-3 p-3 rounded-lg bg-red-50 border border-red-200 text-red-800 text-sm">{err}</div>}
        <div className="p-4 space-y-5">
          <div className="space-y-2">
            <label className="block"><span className="text-xs uppercase tracking-wider text-gray-500 font-semibold">Fare — office to customer (₹)</span>
              <input type="number" inputMode="decimal" min="0" step="1" value={fareTo} onChange={e => setFareTo(e.target.value)} className="mt-1 w-full border border-gray-300 rounded-lg px-3 py-3 text-base" /></label>
            <FileField label="Invoices — to customer" files={filesTo} setFiles={setFilesTo} />
          </div>
          <div className="space-y-2">
            <label className="block"><span className="text-xs uppercase tracking-wider text-gray-500 font-semibold">Fare — customer to office (₹)</span>
              <input type="number" inputMode="decimal" min="0" step="1" value={fareBack} onChange={e => setFareBack(e.target.value)} className="mt-1 w-full border border-gray-300 rounded-lg px-3 py-3 text-base" /></label>
            <FileField label="Invoices — return trip" files={filesBack} setFiles={setFilesBack} />
          </div>
          <div>
            <div className="text-xs uppercase tracking-wider text-gray-500 font-semibold mb-2">Paid using</div>
            <div className="grid grid-cols-2 gap-2">
              {["Petty cash","UPI"].map(m => <button type="button" key={m} onClick={() => setMethod(m)} className={`py-3 rounded-lg border text-sm font-semibold ${method === m ? "bg-blue-600 text-white border-blue-600" : "bg-white text-gray-700 border-gray-300"}`}>{m}</button>)}
            </div>
          </div>
          <label className="block"><span className="text-xs uppercase tracking-wider text-gray-500 font-semibold">Note (optional)</span>
            <input value={note} onChange={e => setNote(e.target.value)} className="mt-1 w-full border border-gray-300 rounded-lg px-3 py-3 text-base" /></label>
          <div className="text-sm text-gray-700 bg-gray-50 border border-gray-200 rounded-lg p-3">Total: <b>{inr((Number(fareTo)||0) + (Number(fareBack)||0))}</b> · {method}</div>
        </div>
        <div className="sticky bottom-0 bg-white border-t border-gray-200 p-4 pb-safe">
          <button disabled={busy} className="w-full py-3 rounded-lg bg-blue-600 text-white font-semibold disabled:opacity-60">{busy ? `Uploading ${filesTo.length + filesBack.length} image${filesTo.length + filesBack.length === 1 ? "" : "s"}…` : "Submit expense"}</button>
        </div>
      </form>
    </div>
  );
}

// All of this month's meetings / visits (up to today) that don't have a travel expense yet
function usePendingBills(staff, refreshKey) {
  const [list, setList] = useState(null);
  useEffect(() => {
    let alive = true;
    (async () => {
      const today = toISO(new Date());
      const first = today.slice(0, 8) + "01";
      const [m, v, e] = await Promise.all([
        supabase.from("designer_meetings").select("id,meeting_date,timing_from,timing,customer_name,client_id,address,area,visit_type,status,meeting_type")
          .gte("meeting_date", first).lte("meeting_date", today).is("deleted_at", null).or(`designer_name.eq.${staff.name},support_name.eq.${staff.name}`),
        supabase.from("field_visits").select("id,visit_date,timing,customer_name,client_id,address,visit_type")
          .gte("visit_date", first).lte("visit_date", today).is("deleted_at", null).or(`stylist.eq.${staff.name},support_name.eq.${staff.name}`),
        supabase.from("travel_expenses").select("meeting_id,visit_id").eq("staff_id", staff.id).gte("expense_date", first),
      ]);
      if (!alive) return;
      const doneM = new Set((e.data || []).map(x => x.meeting_id).filter(Boolean));
      const doneV = new Set((e.data || []).map(x => x.visit_id).filter(Boolean));
      const mm = (m.data || []).filter(x => x.status !== "Office visit" && !doneM.has(x.id))   // office visits = customer came to us, no travel
        .map(x => ({ kind: "meeting", id: x.id, date: x.meeting_date, time: x.timing_from || x.timing || "", customer: x.customer_name, clientId: x.client_id, address: [x.address, x.area].filter(Boolean).join(", "), visit: x.visit_type || "Meeting", type: x.meeting_type }));
      const vv = (v.data || []).filter(x => !doneV.has(x.id))
        .map(x => ({ kind: "visit", id: x.id, date: x.visit_date, time: x.timing || "", customer: x.customer_name, clientId: x.client_id, address: x.address || "", visit: x.visit_type || "" }));
      setList([...mm, ...vv].sort((a, b) => b.date.localeCompare(a.date) || ((timeToMinutes(a.time) ?? 9999) - (timeToMinutes(b.time) ?? 9999))));
    })();
    return () => { alive = false; };
  }, [staff.id, refreshKey]);
  return list;
}

function MyExpenses({ staff, refreshKey, onChanged }) {
  const [rows, setRows] = useState(null); const [adv, setAdv] = useState([]);
  const pending = usePendingBills(staff, refreshKey);
  const [view, setView] = useState(null);       // "pending" | "submitted"
  const [billFor, setBillFor] = useState(null);
  useEffect(() => { if (view === null && pending !== null) setView(pending.length ? "pending" : "submitted"); }, [pending]);
  useEffect(() => {
    (async () => {
      const [e, a] = await Promise.all([
        supabase.from("travel_expenses").select("*").eq("staff_id", staff.id).order("expense_date", { ascending:false }).order("created_at", { ascending:false }).limit(200),
        supabase.from("petty_cash_advances").select("*").eq("staff_id", staff.id),
      ]);
      setRows(e.data || []); setAdv(a.data || []);
    })();
  }, [staff.id, refreshKey]);
  if (rows === null) return <Center><Spinner /></Center>;
  const received = adv.reduce((s,x) => s + Number(x.amount||0), 0);
  const spentCash = rows.filter(r => r.payment_method === "Petty cash").reduce((s,r) => s + Number(r.fare_to||0) + Number(r.fare_back||0), 0);
  const spentUpi = rows.filter(r => r.payment_method === "UPI").reduce((s,r) => s + Number(r.fare_to||0) + Number(r.fare_back||0), 0);
  return (
    <div>
      <div className="grid grid-cols-3 gap-2 mb-4">
        <Stat label="Petty cash received" v={inr(received)} />
        <Stat label="Petty cash spent" v={inr(spentCash)} />
        <Stat label="Balance in hand" v={inr(received - spentCash)} hi />
      </div>
      <div className="text-xs text-gray-500 mb-3">UPI paid by you (to be reimbursed): <b>{inr(spentUpi)}</b></div>
      <div className="grid grid-cols-2 gap-1 p-1 bg-gray-100 rounded-xl mb-3">
        <button onClick={() => setView("pending")} className={`py-2 rounded-lg text-sm font-semibold ${view === "pending" ? "bg-white shadow text-gray-900" : "text-gray-500"}`}>
          Bills pending {pending !== null && <span className={`ml-1 text-xs rounded-full px-2 py-0.5 ${pending.length ? "bg-red-600 text-white" : "bg-gray-200 text-gray-600"}`}>{pending.length}</span>}
        </button>
        <button onClick={() => setView("submitted")} className={`py-2 rounded-lg text-sm font-semibold ${view === "submitted" ? "bg-white shadow text-gray-900" : "text-gray-500"}`}>
          Submitted <span className="ml-1 text-xs rounded-full px-2 py-0.5 bg-gray-200 text-gray-600">{rows.length}</span>
        </button>
      </div>
      {view === "pending" && (
        <div>
          <div className="text-xs text-gray-500 mb-2">Meetings and visits from this month with no travel bill attached. Office visits are not included.</div>
          {pending === null && <Center><Spinner /></Center>}
          {pending && pending.length === 0 && <div className="text-center text-green-700 py-12">✓ All bills for this month are attached.</div>}
          <div className="space-y-3">
            {(pending || []).map(r => (
              <div key={r.kind + r.id} className="bg-white border border-amber-200 rounded-xl p-3">
                <div className="flex items-start justify-between gap-2">
                  <div className="min-w-0">
                    <div className="text-xs font-semibold text-amber-700">{niceDate(r.date)}{r.time ? ` · ${r.time}` : ""} · {r.visit}</div>
                    <div className="font-semibold text-gray-900 mt-0.5">{r.customer || "—"}</div>
                    {r.clientId && <div className="font-mono text-[11px] font-semibold text-blue-700">{r.clientId}</div>}
                    {r.address && <div className="text-sm text-gray-600 truncate">📍 {r.address}</div>}
                  </div>
                  {r.type && <span className="text-[10px] bg-gray-100 text-gray-600 rounded px-1.5 py-0.5 whitespace-nowrap">{r.type}</span>}
                </div>
                <button onClick={() => setBillFor(r)} className="mt-2 w-full py-2.5 rounded-lg bg-blue-600 text-white text-sm font-semibold">Attach travel bill</button>
              </div>
            ))}
          </div>
        </div>
      )}
      {billFor && <ExpenseForm staff={staff} date={billFor.date} row={billFor} onClose={() => setBillFor(null)} onSaved={() => { setBillFor(null); onChanged && onChanged(); }} />}
      {view === "submitted" && rows.length === 0 && <div className="text-center text-gray-500 py-12">No expenses submitted yet.</div>}
      <div className={`space-y-3 ${view === "submitted" ? "" : "hidden"}`}>
        {rows.map(r => (
          <div key={r.id} className="bg-white border border-gray-200 rounded-xl p-3">
            <div className="flex justify-between text-sm"><span className="font-semibold">{r.customer_name || "—"}</span><span className="text-gray-500">{niceDate(r.expense_date)}</span></div>
            <div className="text-sm text-gray-700 mt-1">To {inr(r.fare_to)} · Back {inr(r.fare_back)} · <b>{inr(Number(r.fare_to)+Number(r.fare_back))}</b> · {r.payment_method}</div>
            {[["To", (r.invoice_to_paths && r.invoice_to_paths.length) ? r.invoice_to_paths : (r.invoice_to_path ? [r.invoice_to_path] : [])],
              ["Back", (r.invoice_back_paths && r.invoice_back_paths.length) ? r.invoice_back_paths : (r.invoice_back_path ? [r.invoice_back_path] : [])]]
              .filter(([, ps]) => ps.length > 0)
              .map(([lbl, ps]) => (
                <div key={lbl} className="flex items-center gap-2 mt-2 flex-wrap">
                  <span className="text-[10px] uppercase tracking-wider text-gray-400 w-8">{lbl}</span>
                  {ps.map(p => <a key={p} href={publicUrl(p)} target="_blank" rel="noopener"><img src={publicUrl(p)} className="h-16 w-16 object-cover rounded border" alt={lbl} /></a>)}
                </div>
              ))}
            {r.note && <div className="text-xs text-gray-500 mt-1">{r.note}</div>}
          </div>
        ))}
      </div>
    </div>
  );
}
const Stat = ({ label, v, hi }) => <div className={`rounded-xl p-3 border ${hi ? "bg-blue-50 border-blue-200" : "bg-white border-gray-200"}`}><div className="text-[10px] uppercase tracking-wider text-gray-500">{label}</div><div className="text-base font-bold text-gray-900 mt-0.5">{v}</div></div>;

function ChangePassword({ onClose }) {
  const [p1, setP1] = useState(""); const [p2, setP2] = useState(""); const [msg, setMsg] = useState(null); const [busy, setBusy] = useState(false);
  const submit = async e => {
    e.preventDefault(); setMsg(null);
    if (p1.length < 6) { setMsg({ err:"Password must be at least 6 characters." }); return; }
    if (p1 !== p2) { setMsg({ err:"Passwords don't match." }); return; }
    setBusy(true);
    const { error } = await supabase.auth.updateUser({ password: p1 });
    setBusy(false);
    if (error) setMsg({ err: error.message }); else { setMsg({ ok:"Password changed." }); setTimeout(onClose, 1200); }
  };
  return (
    <div className="fixed inset-0 z-50 bg-gray-900/50 flex items-end" onClick={onClose}>
      <form onSubmit={submit} className="bg-white w-full rounded-t-2xl p-4 pb-safe space-y-3" onClick={e => e.stopPropagation()}>
        <div className="font-semibold">Change password</div>
        <input type="password" placeholder="New password" value={p1} onChange={e => setP1(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-3 text-base" />
        <input type="password" placeholder="Confirm new password" value={p2} onChange={e => setP2(e.target.value)} className="w-full border border-gray-300 rounded-lg px-3 py-3 text-base" />
        {msg?.err && <div className="text-sm text-red-700">{msg.err}</div>}
        {msg?.ok && <div className="text-sm text-green-700">{msg.ok}</div>}
        <button disabled={busy} className="w-full py-3 rounded-lg bg-blue-600 text-white font-semibold disabled:opacity-60">Save</button>
      </form>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
