              <table className="w-full text-sm">
                <thead><tr className="border-b border-gray-200 bg-gray-50"><th className={th}>Paid on</th><th className={th}>UTR / ref</th><th className={th}>Staff</th><th className={th}>Bill date</th><th className={th}>Customer</th><th className={th}>Amount</th><th className={th}>Paid by</th><th className={th}></th></tr></thead>
                <tbody>
                  {paid.map(r => (
                    <tr key={r.id} className="border-b border-gray-100 last:border-0">
                      <td className="px-3 py-2 whitespace-nowrap">{fmtD(r.paid_on)}</td><td className="px-3 py-2 font-mono text-xs">{r.payment_ref || "—"}</td>
                      <td className="px-3 py-2">{r.staff_name}</td><td className="px-3 py-2 whitespace-nowrap">{fmtD(r.expense_date)}</td>
                      <td className="px-3 py-2">{r.customer_name || "—"}</td><td className="px-3 py-2 font-semibold">{inrA(expTotal(r))}</td>
                      <td className="px-3 py-2 text-xs text-gray-500">{r.paid_by}</td>
                      <td className="px-3 py-2"><button onClick={async () => {
                        if (!confirm("Undo this payment? The bill goes back to To pay.")) return;
                        const { error } = await supabase.from("travel_expenses").update({ paid_on: null, paid_by: null, payment_ref: null, paid_at: null }).eq("id", r.id);
                        if (error) alert(error.message); else setTick(t => t + 1);
                      }} className="text-xs text-gray-500 hover:underline">Undo</button></td>
                    </tr>))}
                  {paid.length === 0 && <tr><td colSpan="8" className="text-center py-10 text-gray-500">No payments recorded yet.</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        )}
      </main>}
      {paying && <MarkPaidModal user={user} paying={paying} onClose={() => setPaying(null)} onDone={() => { setPaying(null); setTick(t => t + 1); }} />}
    </div>
  );
}

function MarkPaidModal({ user, paying, onClose, onDone }) {
  const d = new Date(); const p = n => String(n).padStart(2, "0");
  const [on, setOn] = useState(`${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`);
  const [ref, setRef] = useState(""); const [busy, setBusy] = useState(false); const [err, setErr] = useState(null);
  const total = paying.bills.reduce((t, r) => t + expTotal(r), 0);
  const save = async (e) => {
    e.preventDefault();
    if (!ref.trim()) { setErr("Enter the UTR / transaction reference."); return; }
    setBusy(true);
    const { error } = await supabase.from("travel_expenses").update({ paid_on: on, payment_ref: ref.trim(), paid_by: user.full_name || user.email, paid_at: new Date().toISOString() })
      .in("id", paying.bills.map(b => b.id)).is("paid_on", null);
    setBusy(false);
    if (error) { setErr(error.message); return; }
    onDone();
  };
  const inp = "mt-1 w-full bg-white border border-gray-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500";
  return (
    <div className="fixed inset-0 z-50 bg-gray-900/50 flex items-center justify-center p-4" onClick={onClose}>
      <form onSubmit={save} className="bg-white rounded-2xl w-full max-w-sm shadow-card" onClick={e => e.stopPropagation()}>
        <div className="px-4 py-3 border-b border-gray-200 font-semibold">Mark paid · {paying.name}</div>
        <div className="p-4 space-y-3">
          <div className="text-sm text-gray-700 bg-gray-50 border border-gray-200 rounded-lg p-3">{paying.bills.length} bill{paying.bills.length === 1 ? "" : "s"} · <b>{inrA(total)}</b></div>
          {err && <div className="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg p-2">{err}</div>}
          <label className="block"><span className="text-xs uppercase tracking-wider text-gray-500 font-semibold">Paid on</span><input type="date" value={on} onChange={e => setOn(e.target.value)} className={inp} /></label>
          <label className="block"><span className="text-xs uppercase tracking-wider text-gray-500 font-semibold">UTR / transaction ref *</span><input value={ref} onChange={e => setRef(e.target.value)} placeholder="e.g. 429817364512" className={inp} /></label>
        </div>
        <div className="px-4 py-3 border-t border-gray-200 flex justify-end gap-2">
          <button type="button" onClick={onClose} className="px-4 py-2 rounded-md border border-gray-300 text-sm">Cancel</button>
          <button disabled={busy} className="px-4 py-2 rounded-md bg-green-600 text-white text-sm font-semibold disabled:opacity-60">{busy ? "Saving…" : `Confirm ${inrA(total)} paid`}</button>
        </div>
      </form>
    </div>
  );
}

function PettyCashPanel({ staff, advs, who, user, onChanged, summary }) {
  const today = new Date(); const p = n => String(n).padStart(2, "0");
  const [form, setForm] = useState({ staff_id: who || "", amount: "", advance_date: `${today.getFullYear()}-${p(today.getMonth() + 1)}-${p(today.getDate())}`, note: "" });
  const [busy, setBusy] = useState(false);
  useEffect(() => { if (who) setForm(f => ({ ...f, staff_id: who })); }, [who]);
  const inputCls = "w-full bg-white border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-blue-500";
  const add = async (e) => {
    e.preventDefault();
    const s = staff.find(x => x.id === form.staff_id);
    if (!s || !(Number(form.amount) > 0)) { alert("Pick a staff member and enter an amount."); return; }
    setBusy(true);
    const { error } = await supabase.from("petty_cash_advances").insert({ staff_id: s.id, staff_name: s.name, amount: Number(form.amount), advance_date: form.advance_date,
      note: [form.note, `added by ${user?.full_name || user?.email || "admin"}`].filter(Boolean).join(" · ") });
    setBusy(false);
    if (error) { alert("Could not save: " + error.message); return; }
    setForm(f => ({ ...f, amount: "", note: "" })); onChanged();
  };
  const del = async (a) => {
    if (!confirm(`Delete the ₹${a.amount} advance to ${a.staff_name}?`)) return;
    const { error } = await supabase.from("petty_cash_advances").delete().eq("id", a.id);
    if (error) { alert("Could not delete: " + error.message); return; }
    onChanged();
  };
  const th = "px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-600";
  return (
    <div className="grid lg:grid-cols-3 gap-4">
      <form onSubmit={add} className="bg-white border border-gray-200 rounded-xl p-4 shadow-card space-y-3 h-fit">
        <div className="font-semibold text-gray-900">Give petty cash</div>
        <select value={form.staff_id} onChange={e => setForm(f => ({ ...f, staff_id: e.target.value }))} className={inputCls}>
          <option value="">— select staff —</option>
          {staff.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
        <input type="number" min="0" placeholder="Amount (₹)" value={form.amount} onChange={e => setForm(f => ({ ...f, amount: e.target.value }))} className={inputCls} />
        <input type="date" value={form.advance_date} onChange={e => setForm(f => ({ ...f, advance_date: e.target.value }))} className={inputCls} />
        <input placeholder="Note (optional)" value={form.note} onChange={e => setForm(f => ({ ...f, note: e.target.value }))} className={inputCls} />
        <button disabled={busy} className="w-full py-2.5 rounded-md bg-blue-600 text-white text-sm font-semibold disabled:opacity-60">{busy ? "Saving…" : "Add advance"}</button>
        <div className="text-xs text-gray-500">This shows up in the staff member's "Petty cash received" and balance on their phone.</div>
      </form>
      <div className="lg:col-span-2 space-y-4">
        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
          {summary.filter(r => !who || r.s.id === who).map(r => (
            <div key={r.s.id} className="bg-white border border-gray-200 rounded-xl p-3"><div className="text-sm font-medium text-gray-900">{r.s.name}</div><div className="text-[11px] uppercase tracking-wider text-gray-500 mt-1">In hand</div><div className={`text-lg font-bold ${r.balance < 0 ? "text-red-700" : "text-gray-900"}`}>{inrA(r.balance)}</div></div>
          ))}
        </div>
        <div className="overflow-x-auto rounded-xl border border-gray-200 bg-white shadow-card">
          <table className="w-full text-sm">
            <thead><tr className="border-b border-gray-200 bg-gray-50"><th className={th}>Date</th><th className={th}>Staff</th><th className={th}>Amount</th><th className={th}>Note</th><th className={th}></th></tr></thead>
            <tbody>
              {advs.map(a => <tr key={a.id} className="border-b border-gray-100 last:border-0"><td className="px-3 py-2 whitespace-nowrap">{fmtD(a.advance_date)}</td><td className="px-3 py-2">{a.staff_name}</td><td className="px-3 py-2 font-semibold">{inrA(a.amount)}</td><td className="px-3 py-2 text-gray-600">{a.note || ""}</td><td className="px-3 py-2"><button onClick={() => del(a)} className="text-xs text-red-600 hover:underline">Delete</button></td></tr>)}
              {advs.length === 0 && <tr><td colSpan="5" className="text-center py-8 text-gray-500">No petty cash given yet.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// =========================================================
//                       Trash View
// =========================================================
function TrashView({ meetings, onRestore, onHardDelete }) {
  return (
    <section>
      <div className="mb-4">
        <h2 className="text-lg sm:text-xl font-semibold text-gray-900">Trash</h2>
        <p className="text-sm text-gray-500">
          {meetings.length === 0
            ? "Nothing here — deleted meetings will appear on this page."
            : `${meetings.length} deleted meeting${meetings.length === 1 ? "" : "s"} — restore or delete forever.`}
        </p>
      </div>
      <div className="overflow-x-auto scrollbar-thin rounded-xl border border-gray-200 bg-white shadow-card">
        <table className="w-full text-sm">
          <thead>
            <tr className="border-b border-gray-200 bg-gray-50">
              <th className="px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-600">Deleted On</th>
              <th className="px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-600">Client ID</th>
              <th className="px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-600">Date</th>
              <th className="px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-600">Customer</th>
              <th className="px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-600">Mobile</th>
              <th className="px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-600">Area</th>
              <th className="px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-600">Designer</th>
              <th className="px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-600">Type</th>
              <th className="px-3 py-2"></th>
            </tr>
          </thead>
          <tbody className="divide-y divide-gray-100">
            {meetings.map(m => {
              const c = meetingColor(m.meeting_type, m.status);
              const del = m.deleted_at ? new Date(m.deleted_at) : null;
              const delStr = del ? `${del.toLocaleDateString()} ${del.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}` : "—";
              return (
                <tr key={m.id} className="hover:bg-gray-50">
                  <td className="px-3 py-2 whitespace-nowrap text-gray-600" title={m.deleted_at || ""}>{delStr}</td>
                  <td className="px-3 py-2 whitespace-nowrap font-mono text-xs font-semibold text-blue-700">{m.client_id || "—"}</td>
                  <td className="px-3 py-2 whitespace-nowrap font-mono text-gray-700">{m.meeting_date}</td>
                  <td className="px-3 py-2 whitespace-nowrap font-medium text-gray-900">{m.customer_name || "—"}</td>
                  <td className="px-3 py-2 whitespace-nowrap text-gray-600">{m.mobile_number || "—"}</td>
                  <td className="px-3 py-2 text-gray-700">{m.area || "—"}</td>
                  <td className="px-3 py-2 whitespace-nowrap text-gray-700">{m.designer_name || "—"}</td>
                  <td className="px-3 py-2 whitespace-nowrap">
                    <span className={`${c.chipBg} ${c.text} rounded px-2 py-0.5 text-xs font-semibold`}>{m.meeting_type || "—"}</span>
                  </td>
                  <td className="px-3 py-2 whitespace-nowrap">
                    <div className="flex gap-3">
                      <button onClick={() => onRestore(m.id)} className="text-blue-600 hover:text-blue-800 text-xs font-semibold">Restore</button>
                      <button onClick={() => onHardDelete(m.id)} className="text-red-600 hover:text-red-800 text-xs font-semibold">Delete forever</button>
                    </div>
                  </td>
                </tr>
              );
            })}
            {meetings.length === 0 && (
              <tr>
                <td colSpan="9" className="text-center py-12 text-gray-500">
                  <div className="text-4xl mb-2">🗑️</div>
                  <div>Trash is empty.</div>
                </td>
              </tr>
            )}
          </tbody>
        </table>
      </div>
    </section>
  );
}

function Input({ label, wide, ...rest }) {
  return (
    <label className={`block min-w-0 ${wide ? "sm:col-span-2" : ""}`}>
      <span className="text-xs uppercase tracking-wider text-gray-500 font-semibold">{label}</span>
      <input {...rest} className="mt-1 w-full bg-white border border-gray-300 rounded-md px-3 py-2.5 text-base sm:text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" />
    </label>
  );
}
function Textarea({ label, wide, ...rest }) {
  return (
    <label className={`block min-w-0 ${wide ? "sm:col-span-2" : ""}`}>
      <span className="text-xs uppercase tracking-wider text-gray-500 font-semibold">{label}</span>
      <textarea {...rest} rows="2" className="mt-1 w-full bg-white border border-gray-300 rounded-md px-3 py-2.5 text-base sm:text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" />
    </label>
  );
}
function Select({ label, value, onChange, options, allowEmpty, wide }) {

    <label className={`block min-w-0 ${wide ? "sm:col-span-2" : ""}`}>
      <span className="text-xs uppercase tracking-wider text-gray-500 font-semibold">{label}</span>
      <select value={value} onChange={onChange} className="mt-1 w-full bg-white border border-gray-300 rounded-md px-3 py-2.5 text-base sm:text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
        {allowEmpty && <option value="">— select —</option>}

// =========================================================
//                        Footer
// =========================================================
function Footer() {
  return (
    <footer className="mt-12 py-6 text-center text-xs text-gray-500 border-t border-gray-200 bg-white">
      <Logo className="h-7 mx-auto mb-2 opacity-70" />
      <div>D'Moksha Homes · Meetings Calendar</div>
    </footer>

// =========================================================
//                   Auth gate (existing ERP logins)
// =========================================================
function AuthShell({ children }) {
  return (
    <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-slate-50">
      <Logo className="h-14 mb-1" />
      <div className="text-sm text-gray-500 mb-8">Meetings Calendar</div>
      <div className="w-full max-w-sm bg-white border border-gray-200 rounded-2xl shadow-card p-5">{children}</div>
    </div>
  );
}
const authInput = "mt-1 w-full border border-gray-300 rounded-lg px-3 py-3 text-base focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500";

function LoginScreen() {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState(""); const [pw, setPw] = useState("");
  const [err, setErr] = useState(null); const [msg, setMsg] = useState(null); const [busy, setBusy] = useState(false);
  const signIn = async (e) => {
    e.preventDefault(); setErr(null);
    setBusy(true);
    const { error } = await supabase.auth.signInWithPassword({ email: email.trim().toLowerCase(), password: pw });
    setBusy(false);
    if (error) setErr("Email or password is incorrect.");
  };
  const sendReset = async (e) => {
    e.preventDefault(); setErr(null); setMsg(null);
    if (!email.trim()) { setErr("Enter your email address."); return; }
    setBusy(true);
    const { error } = await supabase.auth.resetPasswordForEmail(email.trim().toLowerCase(), { redirectTo: window.location.origin + "/" });
    setBusy(false);
    if (error) setErr(error.message); else setMsg("If this email has an account, a reset link is on its way. Check your inbox (and spam).");
  };
  return (
    <AuthShell>
      {mode === "login" ? (
        <form onSubmit={signIn} className="space-y-4">
          <div className="text-base font-semibold text-gray-900">Sign in</div>
          <label className="block"><span className="text-xs uppercase tracking-wider text-gray-500 font-semibold">Email</span>
            <input type="email" autoComplete="username" value={email} onChange={e => setEmail(e.target.value)} placeholder="name@dmoksha.com" className={authInput} /></label>
          <label className="block"><span className="text-xs uppercase tracking-wider text-gray-500 font-semibold">Password</span>
            <input type="password" autoComplete="current-password" value={pw} onChange={e => setPw(e.target.value)} className={authInput} /></label>
          {err && <div className="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg p-3">{err}</div>}
          <button disabled={busy} className="w-full py-3 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold disabled:opacity-60">{busy ? "Signing in…" : "Sign in"}</button>
          <div className="text-center text-xs text-gray-500">Use the same email and password as the D'Moksha ERP.</div>
          <button type="button" onClick={() => { setMode("reset"); setErr(null); }} className="w-full text-sm text-blue-600 hover:underline">Forgot password?</button>
        </form>
      ) : (
        <form onSubmit={sendReset} className="space-y-4">
          <div className="text-base font-semibold text-gray-900">Reset password</div>
          <label className="block"><span className="text-xs uppercase tracking-wider text-gray-500 font-semibold">Email</span>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="name@dmoksha.com" className={authInput} /></label>
          {err && <div className="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg p-3">{err}</div>}
          {msg && <div className="text-sm text-green-800 bg-green-50 border border-green-200 rounded-lg p-3">{msg}</div>}
          <button disabled={busy} className="w-full py-3 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold disabled:opacity-60">{busy ? "Sending…" : "Send reset link"}</button>
          <button type="button" onClick={() => { setMode("login"); setErr(null); setMsg(null); }} className="w-full text-sm text-gray-600 hover:underline">← Back to sign in</button>
        </form>
      )}
    </AuthShell>
  );
}

function SetPasswordForm({ onDone, title = "Set a new password" }) {
  const [p1, setP1] = useState(""); const [p2, setP2] = useState("");
  const [err, setErr] = useState(null); const [ok, setOk] = useState(false); const [busy, setBusy] = useState(false);
  const submit = async (e) => {
    e.preventDefault(); setErr(null);
    if (p1.length < 8) { setErr("Use at least 8 characters."); return; }
    if (p1 !== p2) { setErr("Passwords don't match."); return; }
    setBusy(true);
    const { error } = await supabase.auth.updateUser({ password: p1 });
    setBusy(false);
    if (error) setErr(error.message); else { setOk(true); setTimeout(onDone, 1200); }
  };
  return (
    <form onSubmit={submit} className="space-y-4">
      <div className="text-base font-semibold text-gray-900">{title}</div>
      <input type="password" autoComplete="new-password" placeholder="New password" value={p1} onChange={e => setP1(e.target.value)} className={authInput} />
      <input type="password" autoComplete="new-password" placeholder="Confirm new password" value={p2} onChange={e => setP2(e.target.value)} className={authInput} />
      {err && <div className="text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg p-3">{err}</div>}
      {ok && <div className="text-sm text-green-800 bg-green-50 border border-green-200 rounded-lg p-3">Password updated.</div>}
      <button disabled={busy} className="w-full py-3 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold disabled:opacity-60">{busy ? "Saving…" : "Save password"}</button>
      <div className="text-center text-xs text-gray-500">This also changes your ERP password (same account).</div>
    </form>
  );
}

function SetPasswordModal({ onClose }) {
  return (
    <div className="fixed inset-0 z-50 bg-gray-900/50 flex items-center justify-center p-4" onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-card p-5 w-full max-w-sm" onClick={e => e.stopPropagation()}>
        <SetPasswordForm title="Change password" onDone={onClose} />
      </div>
    </div>
  );
}

// People who also have an office (ERP) login but should only use the support-team portal
const PORTAL_ONLY_EMAILS = [];   // Piyush (calling team) has full calendar access again

function App() {
  const [session, setSession] = useState(undefined);
  const [recovery, setRecovery] = useState(() => /type=recovery/.test(window.location.hash));
  const [profile, setProfile] = useState(undefined); // undefined=loading, null=no access, object=ok

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = supabase.auth.onAuthStateChange((event, s) => {
      if (event === "PASSWORD_RECOVERY") setRecovery(true);
      setSession(s || null);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setProfile(undefined); return; }
    const email = (session.user.email || "").toLowerCase();
    supabase.from("users").select("full_name,email,role,is_active").ilike("email", email).maybeSingle()
      .then(({ data }) => setProfile(data && data.is_active ? { ...data, email } : null));
  }, [session]);

  const spinner = <div className="min-h-screen flex items-center justify-center"><div className="spinner h-10 w-10 border-4 border-blue-500 border-t-transparent rounded-full" /></div>;

  if (session === undefined) return spinner;
  if (recovery && session) {
    return <AuthShell><SetPasswordForm onDone={() => { setRecovery(false); history.replaceState(null, "", window.location.pathname); }} /></AuthShell>;
  }
  if (!session) return <LoginScreen />;
  if (profile === undefined) return spinner;
  if (profile === null) {
    return (
      <AuthShell>
        <div className="space-y-4 text-center">
          <div className="text-base font-semibold text-gray-900">No access</div>
          <div className="text-sm text-gray-600">{session.user.email} isn't an active user for the Meetings Calendar. Please contact Ajay.</div>
          <button onClick={() => supabase.auth.signOut()} className="w-full py-3 rounded-lg border border-gray-300 text-gray-700 font-semibold">Sign out</button>
        </div>
      </AuthShell>
    );
  }
  if (PORTAL_ONLY_EMAILS.includes((profile.email || "").toLowerCase())) {
    return (
      <AuthShell>
        <div className="space-y-4 text-center">
          <div className="text-base font-semibold text-gray-900">Please use the support-team portal</div>
          <div className="text-sm text-gray-600">Your account ({profile.email}) is set up for the support-team portal, not the Meetings Calendar.</div>
          <a href="/support-team" className="block w-full py-3 rounded-lg bg-blue-600 text-white font-semibold">Open support-team portal</a>
          <button onClick={() => supabase.auth.signOut()} className="w-full py-3 rounded-lg border border-gray-300 text-gray-700 font-semibold">Sign out</button>
        </div>
      </AuthShell>
    );
  }
  if (profile.role === "accounts") return <AccountsApp user={profile} />;   // accounts team: travel payments only
  return <CalendarApp user={profile} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
