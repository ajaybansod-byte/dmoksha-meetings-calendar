<script type="text/babel" data-presets="env,react-classic">
const { useState, useEffect, useMemo } = React;

// === Supabase config (publishable / anon key — safe for frontend) ===
const SUPABASE_URL = "https://pncdmkqhfclymmyldmas.supabase.co";
const SUPABASE_KEY = "sb_publishable_Mm7ImJtTtEQIAR9KK1DLzw_QGkhptKA";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: "dmoksha-admin-auth", persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });

// === Meeting-type color palette ===
const meetingColor = (type, status) => {
  // Status override: Office visits are teal so they pop against meeting-type colors.
  if ((status || "").toLowerCase() === "office visit") {
    return { chipBg: "bg-teal-500", text: "text-white", border: "border-teal-600", barBg: "bg-teal-500", barText: "text-white", dot: "bg-teal-500" };
  }
  const t = (type || "").toLowerCase();
  if (t.startsWith("1")) return { chipBg: "bg-yellow-300",  text: "text-yellow-900", border: "border-yellow-400", barBg: "bg-yellow-300",  barText: "text-yellow-900", dot: "bg-yellow-400" };
  if (t.startsWith("2")) return { chipBg: "bg-orange-400",  text: "text-orange-950", border: "border-orange-500", barBg: "bg-orange-400",  barText: "text-orange-950", dot: "bg-orange-500" };
  if (t.startsWith("3")) return { chipBg: "bg-red-500",     text: "text-white",      border: "border-red-600",    barBg: "bg-red-500",     barText: "text-white", dot: "bg-red-500" };
  if (t.startsWith("4")) return { chipBg: "bg-rose-700",    text: "text-white",      border: "border-rose-800",   barBg: "bg-rose-700",    barText: "text-white", dot: "bg-rose-700" };
  if (t.startsWith("5")) return { chipBg: "bg-purple-700",  text: "text-white",      border: "border-purple-800", barBg: "bg-purple-700",  barText: "text-white", dot: "bg-purple-700" };
  return { chipBg: "bg-gray-300", text: "text-gray-900", border: "border-gray-400", barBg: "bg-gray-300", barText: "text-gray-900", dot: "bg-gray-400" };
};

const MEETING_TYPES = ["1st Meeting", "2nd Meeting", "3rd Meeting", "4th Meeting", "5th Meeting"];
const STATUSES = ["Converted", "Dropped", "Ongoing", "Estimate sent", "Estimate Pending", "2nd meeting pending", "Office visit"];
const RECORDING_OPTS = ["Yes", "No"];
const DESIGNERS = ["Fatima Khan", "Janvi Shah", "Neha Agarwal", "Ritika Baijal", "Tarannum Momin"];
const CITIES = ["Mumbai", "Pune", "Bhubaneswar"];
const SUPPORT_STAFF_BY_CITY = {
  Mumbai: ["Dharmveer", "Mohit", "Piyush", "Rakesh", "Regan", "Satyaprakash", "Shanjit", "Sunil"],
  Pune: ["Deepak"],
  Bhubaneswar: [],
};
const supportFor = (c) => SUPPORT_STAFF_BY_CITY[c || "Mumbai"] || [];
const VISIT_TYPES = ["Meeting", "Measurement", "Installation", "Track installation", "Collection for alteration", "Cash collection", "Upholstery", "Ironing"];
const HOME_OWNERSHIP = ["Rented", "Owned"];
const BUDGET_RANGES = ["₹10K - ₹15K", "₹15K - ₹20K", "₹20K - ₹25K", "Above ₹25K"];

// === Time helpers ===
const HOURS = Array.from({ length: 12 }, (_, i) => String(i + 1));            // ["1","2",...,"12"]
const MINUTES = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, "0")); // ["00","01",...,"59"]
const PERIODS = ["AM", "PM"];

// Parse "10:30 AM" → { hour: "10", minute: "30", period: "AM" }; tolerant of "10.30 am", "10:30AM", etc.
function parseTimeParts(s) {
  if (!s) return { hour: "", minute: "", period: "" };
  const text = String(s).trim();
  const m = text.match(/(\d{1,2})\s*[:.]?\s*(\d{1,2})?\s*([aApP][mM])?/);
  if (!m) return { hour: "", minute: "", period: "" };
  return {
    hour: m[1] ? String(parseInt(m[1], 10)) : "",
    minute: m[2] ? String(m[2]).padStart(2, "0") : "",
    period: m[3] ? m[3].toUpperCase() : "",
  };
}

function formatTimeParts({ hour, minute, period }) {
  if (!hour) return null;            // need at least hour to count as a value
  return `${hour}:${minute || "00"} ${period || "AM"}`;
}

// "10:30 AM" → 630 (minutes since midnight, for sorting/range checks)
function timeToMinutes(s) {
  const p = parseTimeParts(s);
  if (!p.hour) return null;
  let h = parseInt(p.hour, 10) % 12;
  if (p.period === "PM") h += 12;
  return h * 60 + (parseInt(p.minute || "0", 10));
}

// "10:30 AM" + "11:30 AM" → "10:30 AM – 11:30 AM"; partial fallbacks; null → "—"
function displayTiming(from, to, legacy) {
  const fromVal = from || (legacy && parseTimeParts(legacy).hour ? legacy : null);
  if (!fromVal && !to) return "—";
  if (fromVal && to) return `${fromVal} – ${to}`;
  return fromVal || to || "—";
}

// === Date helpers ===
const pad = (n) => String(n).padStart(2, "0");
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const monthName = (i) => ["January","February","March","April","May","June","July","August","September","October","November","December"][i];
const shortMonth = (i) => ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][i];
const fullDayName = (d) => ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()];

// === D'Moksha Logo ===
const Logo = ({ className = "h-10", fill = "#111827" }) => (
  <svg viewBox="0 0 240 64" xmlns="http://www.w3.org/2000/svg" className={className} preserveAspectRatio="xMidYMid meet">
    <text x="120" y="36" textAnchor="middle" fontFamily="serif" fontWeight="700" fontSize="30" fill={fill} letterSpacing="2">D'MOKSHA</text>
    <text x="120" y="56" textAnchor="middle" fontFamily="sans-serif" fontWeight="300" fontSize="14" fill={fill} letterSpacing="6">HOMES</text>
  </svg>
);

// =========================================================
//                         App
// =========================================================
const EMPTY_FILTERS = { designer: "", type: "", status: "", q: "" };

function CalendarApp({ user }) {
  const [view, setView] = useState("calendar");
  const [meetings, setMeetings] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const [cursor, setCursor] = useState(() => {
    const t = new Date();
    return new Date(t.getFullYear(), t.getMonth(), 1);
  });

  const [selectedDate, setSelectedDate] = useState(null);
  const [editing, setEditing] = useState(null);
  const [filters, setFilters] = useState(EMPTY_FILTERS);
  const [exportOpen, setExportOpen] = useState(false);
  const [fieldVisits, setFieldVisits] = useState([]);
  const [workloadFocus, setWorkloadFocus] = useState(null);
  const [city, setCity] = useState(() => { try { const v = localStorage.getItem("dmoksha.city"); return CITIES.includes(v) ? v : "Mumbai"; } catch { return "Mumbai"; } });
  useEffect(() => { try { localStorage.setItem("dmoksha.city", city); } catch {} }, [city]);

  const loadMeetings = async () => {
    setLoading(true);
    setError(null);
    const { data, error } = await supabase
      .from("designer_meetings")
      .select("*")
      .order("meeting_date", { ascending: true });
    if (error) { setError(error.message); setLoading(false); return; }
    setMeetings(data || []);
    setLoading(false);
  };

  const loadFieldVisits = async () => {
    const { data, error } = await supabase.from("field_visits").select("*").order("visit_date", { ascending: true });
    if (!error) setFieldVisits(data || []);
  };
  useEffect(() => { loadMeetings(); loadFieldVisits(); }, []);

  const filteredMeetings = useMemo(() => {
    const q = (filters.q || "").toLowerCase();
    return meetings.filter(m => {
      if (m.deleted_at) return false; // hide soft-deleted from Calendar/List/Export
      if ((m.location || "Mumbai") !== city) return false; // scope to selected city
      if (filters.designer && m.designer_name !== filters.designer) return false;
      if (filters.type && m.meeting_type !== filters.type) return false;
      if (filters.status && m.status !== filters.status) return false;
      if (q) {
        const hay = [m.client_id, m.customer_name, m.area, m.address, m.remarks, m.sj, m.support_name, m.mobile_number]
          .filter(Boolean).join(" ").toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }, [meetings, filters, city]);

  const deletedMeetings = useMemo(
    () => meetings.filter(m => m.deleted_at && (m.location || "Mumbai") === city).sort((a, b) => (b.deleted_at || "").localeCompare(a.deleted_at || "")),
    [meetings, city]
  );

  const cityActiveCount = useMemo(
    () => meetings.filter(m => !m.deleted_at && (m.location || "Mumbai") === city).length,
    [meetings, city]
  );
  const cityCounts = useMemo(() => {
    const c = {};
    CITIES.forEach(k => c[k] = 0);
    meetings.forEach(m => { if (m.deleted_at) return; const loc = m.location || "Mumbai"; if (c[loc] !== undefined) c[loc]++; });
    return c;
  }, [meetings]);

  const meetingsByDate = useMemo(() => {
    const map = {};
    for (const m of filteredMeetings) {
      (map[m.meeting_date] = map[m.meeting_date] || []).push(m);
    }
    return map;
  }, [filteredMeetings]);

  const goToday = () => {
    const t = new Date();
    setCursor(new Date(t.getFullYear(), t.getMonth(), 1));
  };
  const prevMonth = () => setCursor(new Date(cursor.getFullYear(), cursor.getMonth()-1, 1));
  const nextMonth = () => setCursor(new Date(cursor.getFullYear(), cursor.getMonth()+1, 1));

  // handleSave now THROWS on error so the modal can catch and show inline.
  const handleSave = async (rec) => {
    const payload = { ...rec };
    delete payload.id;
    delete payload.created_at;
    delete payload.updated_at;
    delete payload.deleted_at;
    if (payload.windows === "" || payload.windows === null) payload.windows = null;
    else payload.windows = Number(payload.windows);
    Object.keys(payload).forEach(k => { if (payload[k] === "") payload[k] = null; });

    if (rec.id) {
      const { error } = await supabase.from("designer_meetings").update(payload).eq("id", rec.id);
      if (error) throw new Error(error.message || "Supabase update failed");
    } else {
      const { error } = await supabase.from("designer_meetings").insert(payload);
      if (error) throw new Error(error.message || "Supabase insert failed");
    }
    setEditing(null);
    await loadMeetings();
  };

  // Soft delete — stamps deleted_at; row hidden from Calendar/List/Export.
  const handleDelete = async (id) => {
    const { error } = await supabase
      .from("designer_meetings")
      .update({ deleted_at: new Date().toISOString() })
      .eq("id", id);
    if (error) throw new Error(error.message || "Delete failed");
    setEditing(null);
    await loadMeetings();
  };

  // Restore a soft-deleted meeting back into the live views.
  const handleRestore = async (id) => {
    const { error } = await supabase
      .from("designer_meetings")
      .update({ deleted_at: null })
      .eq("id", id);
    if (error) { alert("Restore failed: " + error.message); return; }
    await loadMeetings();
  };

  // Permanent delete from Trash view — irreversible.
  const handleHardDelete = async (id) => {
    if (!confirm("Permanently delete this meeting? This cannot be undone.")) return;
    const { error } = await supabase.from("designer_meetings").delete().eq("id", id);
    if (error) { alert("Delete failed: " + error.message); return; }
    await loadMeetings();
  };

  // ---- Scheduling tab handlers ----
  const updateMeetingField = async (id, field, value) => {
    const { error } = await supabase.from("designer_meetings").update({ [field]: value || null }).eq("id", id);
    if (error) { alert("Update failed: " + error.message); return; }
    setMeetings(ms => ms.map(m => m.id === id ? { ...m, [field]: value || null } : m));
  };
  const updateVisitField = async (id, field, value) => {
    const { error } = await supabase.from("field_visits").update({ [field]: value || null }).eq("id", id);
    if (error) { alert("Update failed: " + error.message); return; }
    setFieldVisits(vs => vs.map(v => v.id === id ? { ...v, [field]: value || null } : v));
  };
  const addFieldVisit = async (payload) => {
    const clean = {};
    Object.keys(payload).forEach(k => { clean[k] = payload[k] === "" ? null : payload[k]; });
    const { id, ...rest } = clean;
    const { error } = id
      ? await supabase.from("field_visits").update(rest).eq("id", id)      // edit existing visit
      : await supabase.from("field_visits").insert({ ...rest, city });
    if (error) throw new Error(error.message || "Could not add visit");
    await loadFieldVisits();
  };
  const deleteFieldVisit = async (id) => {
    if (!confirm("Remove this visit from the schedule?")) return;
    const { error } = await supabase.from("field_visits").delete().eq("id", id);
    if (error) { alert("Delete failed: " + error.message); return; }
    await loadFieldVisits();
  };

  return (
    <div className="min-h-screen bg-slate-50 text-gray-900">
      <Header
        view={view}
        setView={setView}
        onAddNew={() => setEditing({ meeting_date: toISO(new Date()), meeting_type: "1st Meeting", location: city })}
        onExport={() => setExportOpen(true)}
        deletedCount={deletedMeetings.length}
        user={user}
      />

      {loading && (
        <div className="flex items-center justify-center py-24">
          <div className="spinner h-10 w-10 border-4 border-blue-500 border-t-transparent rounded-full" />
        </div>
      )}
      {error && (
        <div className="max-w-3xl mx-auto mt-6 p-4 rounded-lg bg-red-50 border border-red-200 text-red-800">
          Error: {error}
        </div>
      )}

      {!loading && !error && (
        <main className="max-w-7xl mx-auto px-3 sm:px-6 py-4 sm:py-6">
          <CityToggle city={city} setCity={setCity} counts={cityCounts} />
          {view !== "trash" && view !== "schedule" && view !== "workload" && (
            <FilterBar
              meetings={meetings}
              filters={filters}
              setFilters={setFilters}
              totalCount={cityActiveCount}
              filteredCount={filteredMeetings.length}
            />
          )}

          {view === "calendar" ? (
            <CalendarView
              cursor={cursor}
              onPrev={prevMonth}
              onNext={nextMonth}
              onToday={goToday}
              meetingsByDate={meetingsByDate}
              onSelectDate={(d) => setSelectedDate(d)}
            />
          ) : view === "list" ? (
            <ListView meetings={filteredMeetings} onEdit={(m) => setEditing(m)} />
          ) : view === "schedule" ? (
            <ScheduleView
              meetings={meetings}
              fieldVisits={fieldVisits}
              city={city}
              onUpdateMeeting={updateMeetingField}
              onUpdateVisit={updateVisitField}
              onAddVisit={addFieldVisit}
              onDeleteVisit={deleteFieldVisit}
              onEditMeeting={(m) => setEditing(m)}
              onOpenWorkload={(name) => { setWorkloadFocus(typeof name === "string" ? name : null); setView("workload"); }}
            />
          ) : view === "workload" ? (
            <WorkloadView meetings={meetings} fieldVisits={fieldVisits} city={city} focus={workloadFocus} />
          ) : view === "fieldteam" ? (
            <FieldTeamView city={city} user={user} />
          ) : (
            <TrashView meetings={deletedMeetings} onRestore={handleRestore} onHardDelete={handleHardDelete} />
          )}
          {view !== "trash" && view !== "schedule" && view !== "workload" && view !== "fieldteam" && <Legend />}
        </main>
      )}

      {selectedDate && (
        <DayPanel
          date={selectedDate}
          meetings={meetingsByDate[selectedDate] || []}
          onClose={() => setSelectedDate(null)}
          onEdit={(m) => { setSelectedDate(null); setEditing(m); }}
          onAdd={() => { setSelectedDate(null); setEditing({ meeting_date: selectedDate, meeting_type: "1st Meeting", location: city }); }}
        />
      )}

      {editing && (
        <EditModal
          record={editing}
          onClose={() => setEditing(null)}
          onSave={handleSave}
          onDelete={handleDelete}
        />
      )}

      {exportOpen && (
        <ExportModal
          city={city}
          meetings={[
            ...meetings.map(m => ({ ...m, location: m.location || "Mumbai", _record: "Meeting" })),
            ...fieldVisits.map(v => ({
              _record: "Field visit",
              id: v.id, meeting_date: v.visit_date, location: v.city || "Mumbai", deleted_at: v.deleted_at,
              timing_from: v.timing, customer_name: v.customer_name, address: v.address,
              designer_name: v.stylist, support_name: v.support_name, visit_type: v.visit_type,
            })),
          ]}
          onClose={() => setExportOpen(false)}
        />
      )}

      <Footer />
    </div>
  );
}

// =========================================================
//                       Header
// =========================================================
function Header({ view, setView, onAddNew, onExport, deletedCount, user }) {
  const [menuOpen, setMenuOpen] = useState(false);
  const [pwOpen, setPwOpen] = useState(false);
  return (
    <header className="bg-white border-b border-gray-200 shadow-soft sticky top-0 z-30">
      <div className="max-w-7xl mx-auto px-3 sm:px-6 py-3 flex flex-row items-center gap-3 justify-between">
        <div className="flex items-center gap-2 sm:gap-4 min-w-0">
          <Logo className="h-8 sm:h-10 shrink-0" />
          <div className="hidden sm:block w-px h-8 bg-gray-200" />
          <div className="hidden md:block">
            <div className="text-lg font-semibold text-gray-900">Meetings Calendar</div>
            <div className="text-xs text-gray-500">Designer appointments &amp; visits</div>
          </div>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          <div className="flex rounded-full overflow-hidden border border-gray-300 bg-gray-50">
            <button onClick={() => setView("calendar")} className={`px-3 sm:px-4 py-2 text-xs sm:text-sm font-medium transition ${view === "calendar" ? "bg-blue-600 text-white" : "text-gray-700 hover:bg-gray-100"}`}>Calendar</button>
            <button onClick={() => setView("list")} className={`px-3 sm:px-4 py-2 text-xs sm:text-sm font-medium transition ${view === "list" ? "bg-blue-600 text-white" : "text-gray-700 hover:bg-gray-100"}`}>List</button>
            <button onClick={() => setView("schedule")} className={`px-3 sm:px-4 py-2 text-xs sm:text-sm font-medium transition ${view === "schedule" ? "bg-blue-600 text-white" : "text-gray-700 hover:bg-gray-100"}`}>Scheduling</button>
            <button onClick={() => setView("workload")} className={`px-3 sm:px-4 py-2 text-xs sm:text-sm font-medium transition ${view === "workload" ? "bg-blue-600 text-white" : "text-gray-700 hover:bg-gray-100"}`}>Workload</button>
            <button onClick={() => setView("fieldteam")} className={`px-3 sm:px-4 py-2 text-xs sm:text-sm font-medium transition ${view === "fieldteam" ? "bg-blue-600 text-white" : "text-gray-700 hover:bg-gray-100"}`}>Field team</button>
            <button onClick={() => setView("trash")} className={`px-3 sm:px-4 py-2 text-xs sm:text-sm font-medium transition inline-flex items-center gap-1 ${view === "trash" ? "bg-blue-600 text-white" : "text-gray-700 hover:bg-gray-100"}`}>
              Trash
              {deletedCount > 0 && (
                <span className={`inline-flex items-center justify-center rounded-full text-[10px] font-semibold px-1.5 min-w-[18px] h-[18px] ${view === "trash" ? "bg-white text-blue-600" : "bg-red-500 text-white"}`}>{deletedCount}</span>
              )}
            </button>
          </div>
          <button onClick={onExport} title="Export to CSV" className="px-3 sm:px-4 py-2 rounded-full border border-gray-300 bg-white hover:bg-gray-50 text-gray-700 text-xs sm:text-sm font-semibold whitespace-nowrap inline-flex items-center gap-1.5">
            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3" /></svg>
            <span className="hidden sm:inline">Export</span>
          </button>
          <button onClick={onAddNew} className="px-3 sm:px-4 py-2 rounded-full bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-semibold shadow-soft whitespace-nowrap">
            <span className="sm:hidden">+ New</span>
            <span className="hidden sm:inline">+ New Meeting</span>
          </button>
          {user && (
            <div className="relative">
              <button onClick={() => setMenuOpen(o => !o)} title={user.email}
                className="w-9 h-9 rounded-full bg-gray-800 text-white text-sm font-semibold inline-flex items-center justify-center">
                {(user.full_name || user.email || "?").trim().charAt(0).toUpperCase()}
              </button>

function CalendarView({ cursor, onPrev, onNext, onToday, meetingsByDate, onSelectDate }) {
  const year = cursor.getFullYear();
  const month = cursor.getMonth();
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const todayISO = toISO(new Date());

  return (
    <section>
      <div className="flex flex-row items-center justify-between gap-3 mb-3 sm:mb-4">
        <h2 className="text-lg sm:text-2xl font-normal text-gray-900">
          <span className="font-semibold">{monthName(month)}</span>{" "}
          <span className="text-gray-600">{year}</span>
        </h2>
        <div className="flex items-center gap-1.5 sm:gap-2">
          <button onClick={onToday} className="px-3 py-1.5 rounded-md bg-white hover:bg-gray-50 text-sm border border-gray-300 text-gray-700 font-medium">Today</button>
          <button onClick={onPrev} title="Previous month" className="w-9 h-9 inline-flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-700">
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7" /></svg>
          </button>
          <button onClick={onNext} title="Next month" className="w-9 h-9 inline-flex items-center justify-center rounded-full hover:bg-gray-100 text-gray-700">
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" /></svg>
          </button>
        </div>
      </div>

      <div className="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-card">
        <div className="grid grid-cols-7 border-b border-gray-200 bg-gray-50">
          {["S","M","T","W","T","F","S"].map((d, i) => (
            <div key={i} className="text-gray-500 text-[11px] font-semibold text-center py-2 tracking-wider">
              <span className="sm:hidden">{d}</span>
              <span className="hidden sm:inline">{["SUN","MON","TUE","WED","THU","FRI","SAT"][i]}</span>
            </div>
          ))}
        </div>
        <div className="grid grid-cols-7">
          {cells.map((d, i) => {
            if (d === null) return <div key={i} className="bg-gray-50/40 min-h-[64px] sm:min-h-[118px] border-t border-r border-gray-100 last:border-r-0" />;
            const dateISO = toISO(new Date(year, month, d));
            const dayMeetings = meetingsByDate[dateISO] || [];
            const isToday = dateISO === todayISO;
            const colStart = i % 7;
            return (
              <DayCell
                key={i}
                day={d}
                isToday={isToday}
                meetings={dayMeetings}
                hasRightBorder={colStart < 6}
                onClick={() => onSelectDate(dateISO)}
              />
            );
          })}
        </div>
      </div>
    </section>
  );
}

function DayCell({ day, isToday, meetings, hasRightBorder, onClick }) {
  // Aggregate dot rendering: keep order but cap displayed dots
  const MAX_DOTS = 6;
  const dotsShown = meetings.slice(0, MAX_DOTS);
  const dotOverflow = Math.max(0, meetings.length - MAX_DOTS);

  return (
    <button
      onClick={onClick}
      className={`bg-white hover:bg-blue-50/40 active:bg-blue-50 transition-colors min-h-[64px] sm:min-h-[118px] p-1 sm:p-1.5 text-left flex flex-col border-t border-gray-100 ${hasRightBorder ? "border-r" : ""}`}
    >
      <div className="flex items-center justify-between mb-1">
        {isToday ? (
          <div className="w-6 h-6 rounded-full bg-blue-600 text-white text-xs font-semibold flex items-center justify-center">{day}</div>
        ) : (
          <div className="text-xs font-medium text-gray-700 px-1">{day}</div>
        )}
        {/* Mobile-only meeting count badge */}
        {meetings.length > 0 && (
          <span className="sm:hidden text-[10px] font-semibold text-gray-500 pr-0.5">{meetings.length}</span>
        )}
      </div>

      {/* MOBILE: row of colored dots */}
      <div className="sm:hidden flex flex-wrap items-center gap-0.5 mt-auto">
        {dotsShown.map((m, idx) => {
          const c = meetingColor(m.meeting_type, m.status);
          return <span key={idx} className={`w-1.5 h-1.5 rounded-full ${c.dot}`} />;
        })}
        {dotOverflow > 0 && (
          <span className="text-[9px] text-gray-500 leading-none ml-0.5">+{dotOverflow}</span>
        )}
      </div>

      {/* DESKTOP: chip previews */}
      <div className="hidden sm:flex flex-col gap-1 overflow-hidden">
        {meetings.slice(0, 3).map(m => {
          const c = meetingColor(m.meeting_type, m.status);
          return (
            <div key={m.id} className={`${c.chipBg} ${c.text} rounded px-1.5 py-0.5 text-[10px] leading-tight`} title={`${m.designer_name || ""} – ${m.customer_name || ""}`}>
              <div className="font-semibold truncate">{m.designer_name || "—"} · {m.customer_name || "—"}</div>
              <div className="truncate opacity-90">{m.area || "—"} · {displayTiming(m.timing_from, m.timing_to, m.timing)} · {m.windows ? `${m.windows}w` : "—"}</div>
            </div>
          );
        })}
        {meetings.length > 3 && (
          <div className="text-[10px] text-blue-600 font-semibold pl-1">+ {meetings.length - 3} more</div>
        )}
      </div>
    </button>
  );
}

function ListView({ meetings, onEdit }) {
  const [sortBy, setSortBy] = useState({ field: "meeting_date", dir: "desc" });

  const sorted = useMemo(() => {
    const rows = [...meetings];
    const dir = sortBy.dir === "asc" ? 1 : -1;
    rows.sort((a,b) => {
      let va, vb;
      if (sortBy.field === "timing") {
        // sort by parsed minutes so "9:00 AM" < "10:00 AM" < "1:00 PM"
        va = timeToMinutes(a.timing_from || a.timing) ?? Number.POSITIVE_INFINITY;
        vb = timeToMinutes(b.timing_from || b.timing) ?? Number.POSITIVE_INFINITY;
      } else {
        va = a[sortBy.field] ?? "";
        vb = b[sortBy.field] ?? "";
      }
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return 0;
    });
    return rows;
  }, [meetings, sortBy]);

  const toggleSort = (field) => {
    setSortBy(s => s.field === field ? { field, dir: s.dir === "asc" ? "desc" : "asc" } : { field, dir: "asc" });
  };

  const SortHeader = ({ field, children }) => (
    <th onClick={() => toggleSort(field)} className="px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-600 cursor-pointer hover:text-gray-900 select-none whitespace-nowrap bg-gray-50">
      {children} {sortBy.field === field && (sortBy.dir === "asc" ? "▲" : "▼")}
    </th>
  );

  return (
    <section>
      <div className="overflow-x-auto scrollbar-thin rounded-xl border border-gray-200 bg-white shadow-card">
        <table className="w-full text-sm">
          <thead>
            <tr className="border-b border-gray-200">

              <SortHeader field="mobile_number">Mobile</SortHeader>
              <SortHeader field="area">Area</SortHeader>
              <SortHeader field="address">Address</SortHeader>
              <SortHeader field="windows">Windows</SortHeader>
              <SortHeader field="home_ownership">Home</SortHeader>
              <SortHeader field="budget_per_curtain">Budget</SortHeader>
              <SortHeader field="curtains_required">Curtains</SortHeader>
              <SortHeader field="designer_name">Designer</SortHeader>
              <SortHeader field="support_name">Support</SortHeader>
              <SortHeader field="meeting_type">Type</SortHeader>
              <SortHeader field="status">Status</SortHeader>
              <SortHeader field="scheduled_by">Scheduled by</SortHeader>
              <SortHeader field="recording">Rec.</SortHeader>
              <th className="px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-600 bg-gray-50">Reason</th>
              <th className="px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-600 bg-gray-50">Remarks</th>
              <th className="px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-600 bg-gray-50">Sales Journal</th>
              <th className="px-3 py-2 bg-gray-50"></th>
            </tr>
          </thead>
          <tbody className="divide-y divide-gray-100">
            {sorted.map(m => {
              const c = meetingColor(m.meeting_type, m.status);
              return (
                <tr key={m.id} className="hover:bg-gray-50">
                  <td className="px-3 py-2 whitespace-nowrap font-mono text-xs font-semibold text-blue-700">{m.client_id || "—"}</td>

function rangeForPreset(preset) {
  const t = new Date();
  const y = t.getFullYear(), m = t.getMonth(), d = t.getDate();
  if (preset === "week") {
    const dow = (t.getDay() + 6) % 7; // 0=Mon..6=Sun
    const from = new Date(y, m, d - dow);
    const to = new Date(y, m, d - dow + 6);
    return { from: toISO(from), to: toISO(to) };
  }
  if (preset === "month") {
    const from = new Date(y, m, 1);
    const to = new Date(y, m + 1, 0);
    return { from: toISO(from), to: toISO(to) };
  }
  if (preset === "year") {
    return { from: `${y}-01-01`, to: `${y}-12-31` };
  }
  return { from: toISO(t), to: toISO(t) };
}

function csvCell(v) {
  if (v == null) return "";
  const s = String(v);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function downloadCSV(filename, rows, columns) {
  const header = columns.map(c => csvCell(c.label)).join(",");
  const body = rows.map(r => columns.map(c => csvCell(c.get(r))).join(",")).join("\r\n");
  const csv = "\uFEFF" + header + "\r\n" + body;
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const fmtSheetDate = (iso) => { const [y, m, d] = (iso || "").split("-"); return y ? `${m}/${d}/${y}` : ""; };

// =========================================================
//                 Workload (support-staff balance)
// =========================================================
const isInstall = (t) => /install/i.test(t || "");
const isMeetingType = (t) => !t || /^meeting$/i.test(t);
// Unified job list for a city: calendar meetings (not trashed) + field visits
function cityJobs(meetings, fieldVisits, city) {
  const out = [];
  meetings.forEach(m => {
    if (m.deleted_at || (m.location || "Mumbai") !== city) return;
    out.push({ date: m.meeting_date, support: (m.support_name || "").trim(), stylist: (m.designer_name || "").trim(), visit: m.visit_type || "Meeting" });
  });
  fieldVisits.forEach(v => {
    if (v.deleted_at || (v.city || "Mumbai") !== city) return;
    out.push({ date: v.visit_date, support: (v.support_name || "").trim(), stylist: (v.stylist || "").trim(), visit: v.visit_type || "" });
  });
  return out;
}
function weekRange(iso) { const d = new Date(iso + "T00:00:00"); const dow = (d.getDay() + 6) % 7; const a = new Date(d); a.setDate(d.getDate() - dow); const b = new Date(a); b.setDate(a.getDate() + 6); return [toISO(a), toISO(b)]; }
function monthRange(iso) { const d = new Date(iso + "T00:00:00"); return [toISO(new Date(d.getFullYear(), d.getMonth(), 1)), toISO(new Date(d.getFullYear(), d.getMonth() + 1, 0))]; }
function tally(jobs, key, names, from, to) {
  const t = {}; names.forEach(n => t[n] = { m: 0, i: 0, o: 0 });
  jobs.forEach(j => {
    if (j.date < from || j.date > to) return;
    const n = j[key]; if (!n) return;
    if (!t[n]) t[n] = { m: 0, i: 0, o: 0 };
    if (isInstall(j.visit)) t[n].i++; else if (isMeetingType(j.visit)) t[n].m++; else t[n].o++;
  });
  Object.values(t).forEach(x => x.total = x.m + x.i + x.o);
  return t;
}

function WorkloadStrip({ meetings, fieldVisits, city, date, onOpenWorkload }) {
  const names = supportFor(city);
  if (names.length === 0) return null;
  const jobs = cityJobs(meetings, fieldVisits, city);
  const [w0, w1] = weekRange(date), [m0, m1] = monthRange(date);
  const day = tally(jobs, "support", names, date, date);
  const wk = tally(jobs, "support", names, w0, w1);
  const mo = tally(jobs, "support", names, m0, m1);
  const weekTotals = names.map(n => wk[n].total);
  const lo = Math.min(...weekTotals), hi = Math.max(...weekTotals);
  return (
    <div className="mb-4">
      <div className="flex items-center justify-between mb-2">
        <div className="text-xs font-semibold text-gray-500 uppercase tracking-wider">Support staff workload · {city}</div>
        <button onClick={onOpenWorkload} className="text-xs text-blue-600 hover:underline">Full workload report →</button>
      </div>
      <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">
        {names.map(n => {
          const t = wk[n].total;
          const tone = names.length > 1 && lo !== hi
            ? (t === lo ? "border-green-300 bg-green-50" : t === hi ? "border-amber-300 bg-amber-50" : "border-gray-200 bg-white")
            : "border-gray-200 bg-white";
          const tag = names.length > 1 && lo !== hi ? (t === lo ? "Lightest" : t === hi ? "Heaviest" : null) : null;
          return (
            <button key={n} onClick={() => onOpenWorkload(n)} className={`text-left rounded-xl border p-3 hover:shadow-soft transition ${tone}`}>
              <div className="flex items-center justify-between">
                <div className="font-semibold text-gray-900 truncate">{n}</div>
                {tag && <span className={`text-[10px] font-semibold rounded px-1.5 py-0.5 ${t === lo ? "bg-green-600 text-white" : "bg-amber-500 text-white"}`}>{tag}</span>}
              </div>
              <div className="mt-2 grid grid-cols-3 gap-1 text-center">
                {[["Today", day[n]], ["Week", wk[n]], ["Month", mo[n]]].map(([l, v]) => (
                  <div key={l}>
                    <div className="text-[10px] uppercase tracking-wider text-gray-500">{l}</div>
                    <div className="text-lg font-bold text-gray-900 leading-tight">{v.total}</div>
                    <div className="text-[10px] text-gray-500">M {v.m} · I {v.i}{v.o ? ` · O ${v.o}` : ""}</div>
                  </div>
                ))}
              </div>
            </button>
          );
        })}
      </div>
      <div className="text-[11px] text-gray-500 mt-1.5">M = meetings · I = installations · O = other visits (measurement, collection, upholstery). Week = Mon–Sun containing the selected date.</div>
    </div>
  );
}

function WorkloadView({ meetings, fieldVisits, city, focus }) {
  const today = toISO(new Date());
  const [preset, setPreset] = useState("week");
  const [from, setFrom] = useState(weekRange(today)[0]);
  const [to, setTo] = useState(weekRange(today)[1]);
  const [who, setWho] = useState("support");
  const applyPreset = (p) => {
    setPreset(p);
    if (p === "week") { const [a, b] = weekRange(today); setFrom(a); setTo(b); }
    if (p === "month") { const [a, b] = monthRange(today); setFrom(a); setTo(b); }
    if (p === "year") { setFrom(today.slice(0, 4) + "-01-01"); setTo(today.slice(0, 4) + "-12-31"); }
  };
  const jobs = cityJobs(meetings, fieldVisits, city);
  const baseNames = who === "support" ? supportFor(city) : DESIGNERS;
  const t = tally(jobs, who, baseNames, from, to);
  const rows = Object.keys(t).map(n => ({ name: n, ...t[n] })).sort((a, b) => b.total - a.total || a.name.localeCompare(b.name));
  const grand = rows.reduce((s, r) => s + r.total, 0);
  const avg = rows.length ? grand / rows.length : 0;
  const exportCsv = () => {
    const cols = [
      { label: who === "support" ? "Support staff" : "Stylist", get: r => r.name },
      { label: "Meetings", get: r => r.m }, { label: "Installations", get: r => r.i }, { label: "Other visits", get: r => r.o },
      { label: "Total", get: r => r.total }, { label: "Share %", get: r => grand ? Math.round(r.total * 100 / grand) : 0 },
    ];
    downloadCSV(`workload_${who}_${city}_${from}_to_${to}.csv`, rows, cols);
  };
  const Pill = ({ id, children, cur, set }) => (
    <button type="button" onClick={() => set(id)} className={`px-3 py-2 rounded-lg border text-sm font-medium transition ${cur === id ? "bg-blue-600 text-white border-blue-600" : "bg-white text-gray-700 border-gray-300 hover:bg-gray-50"}`}>{children}</button>
  );
  return (
    <section>
      <div className="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 mb-4">
        <div>
          <h2 className="text-lg sm:text-xl font-semibold text-gray-900">Workload · {city}</h2>
          <p className="text-sm text-gray-500">How meetings and installations are spread across the team.</p>
        </div>
        <button onClick={exportCsv} disabled={rows.length === 0} className="px-3 py-2 rounded-md bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold disabled:opacity-50">Download CSV</button>
      </div>
      <div className="bg-white border border-gray-200 rounded-xl shadow-soft p-3 mb-4 flex flex-wrap items-center gap-2">
        <div className="inline-flex rounded-full overflow-hidden border border-gray-300 bg-gray-50 mr-2">
          {[["support", "Support staff"], ["stylist", "Stylists"]].map(([k, l]) => (
            <button key={k} onClick={() => setWho(k)} className={`px-3 py-2 text-sm font-medium ${who === k ? "bg-blue-600 text-white" : "text-gray-700 hover:bg-gray-100"}`}>{l}</button>
          ))}
        </div>
        <Pill id="week" cur={preset} set={applyPreset}>This week</Pill>
        <Pill id="month" cur={preset} set={applyPreset}>This month</Pill>
        <Pill id="year" cur={preset} set={applyPreset}>This year</Pill>
        <Pill id="custom" cur={preset} set={applyPreset}>Custom</Pill>
        <input type="date" value={from} onChange={e => { setPreset("custom"); setFrom(e.target.value); }} className="bg-white border border-gray-300 rounded-md px-2 py-1.5 text-sm" />
        <span className="text-gray-400">→</span>
        <input type="date" value={to} onChange={e => { setPreset("custom"); setTo(e.target.value); }} className="bg-white border border-gray-300 rounded-md px-2 py-1.5 text-sm" />
        <span className="text-sm text-gray-500 ml-auto">{grand} job{grand === 1 ? "" : "s"} · avg {avg.toFixed(1)} per person</span>
      </div>
      <div className="overflow-x-auto scrollbar-thin rounded-xl border border-gray-200 bg-white shadow-card">
        <table className="w-full text-sm">
          <thead>
            <tr className="border-b border-gray-200 bg-gray-50">
              {[who === "support" ? "Support staff" : "Stylist", "Meetings", "Installations", "Other visits", "Total", "Share", "vs average"].map((h, i) => (
                <th key={i} className={`px-3 py-2 text-[11px] font-semibold uppercase tracking-wider text-gray-600 whitespace-nowrap ${i === 0 ? "text-left" : "text-right"}`}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody className="divide-y divide-gray-100">
            {rows.map(r => {
              const diff = r.total - avg;
              const share = grand ? Math.round(r.total * 100 / grand) : 0;
              return (
                <tr key={r.name} className={`hover:bg-gray-50 ${focus === r.name ? "bg-blue-50" : ""}`}>
                  <td className="px-3 py-2 font-medium text-gray-900">{r.name}</td>
                  <td className="px-3 py-2 text-right text-gray-700">{r.m}</td>
                  <td className="px-3 py-2 text-right text-gray-700">{r.i}</td>
                  <td className="px-3 py-2 text-right text-gray-700">{r.o}</td>
                  <td className="px-3 py-2 text-right font-semibold text-gray-900">{r.total}</td>
                  <td className="px-3 py-2 text-right text-gray-700">
                    <div className="inline-flex items-center gap-2"><span className="w-20 h-1.5 bg-gray-100 rounded-full overflow-hidden"><span className="block h-full bg-blue-500" style={{ width: share + "%" }} /></span>{share}%</div>
                  </td>
                  <td className={`px-3 py-2 text-right font-medium ${diff > 0.5 ? "text-amber-700" : diff < -0.5 ? "text-green-700" : "text-gray-500"}`}>{diff > 0 ? "+" : ""}{diff.toFixed(1)}</td>
                </tr>

            })}
            {rows.length === 0 && <tr><td colSpan="7" className="text-center py-12 text-gray-500">No jobs in this range for {city}.</td></tr>}
          </tbody>
        </table>
      </div>
    </section>
  );
}

        <div className="flex flex-wrap items-center gap-2">

          <button onClick={downloadSheet} disabled={rows.length === 0} className="px-3 py-2 rounded-md bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold disabled:opacity-50">Download CSV</button>

                    <option value="">— assign —</option>

                  <select value={r.visit} onChange={e => setField(r, "visit_type", e.target.value)} className={selCls}>

      {editing && <AddVisitModal date={editing.visit_date} city={city} initial={editing} onClose={() => setEditing(null)} onSave={async (p) => { await onAddVisit({ ...p, id: editing.id }); setEditing(null); }} />}
    </section>
  );
}

// Per-layer installation items from an order: "Living room window 1" + Main / Sheer / Blind
function orderInstallItems(order) {
  const items = [];
  (order?.windows || []).forEach((w, i) => {
    const label = `${(w.roomLabel || "Room").trim()} window ${(w.windowIndex ?? i) + 1}`;
    const kind = w.kind || "curtain";
    if (kind === "curtain" || kind === "both") {
      const ct = w.curtain_type || "Main";
      if (ct === "Main" || ct === "Both") items.push({ key: `w${i}-main`, label, layer: "Main" });
      if (ct === "Sheer" || ct === "Both") items.push({ key: `w${i}-sheer`, label, layer: "Sheer" });
    }
    if (kind === "blind" || kind === "both") items.push({ key: `w${i}-blind`, label, layer: "Blind" });
  });
  return items;
}

function AddVisitModal({ date, city, initial, onClose, onSave }) {
  const isEdit = !!initial;
  const [form, setForm] = useState(isEdit
    ? { visit_date: initial.visit_date || date, customer_name: initial.customer_name || "", address: initial.address || "", stylist: initial.stylist || "", support_name: initial.support_name || "",
        visit_type: initial.visit_type || "Installation", timing: initial.timing || "", status: initial.status || "", order_id: initial.order_id || null, client_id: initial.client_id || "", mobile: initial.mobile || "" }
    : { visit_date: date, customer_name: "", address: "", stylist: "", support_name: "", visit_type: "Installation", timing: "", status: "", order_id: null, client_id: "", mobile: "" });
  const keepSelection = React.useRef(isEdit);   // on first load of an edit, keep the saved curtain selection
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState(null);
  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));
  // --- Order picker: links the visit to a customer order (used for the installation checklist) ---
  const [q, setQ] = useState("");
  const [hits, setHits] = useState([]);
  const [searching, setSearching] = useState(false);
  useEffect(() => {
    const term = q.trim();
    if (term.length < 2) { setHits([]); return; }
    let alive = true; setSearching(true);
    const t = setTimeout(async () => {
      const digits = term.replace(/\D/g, "");
      const ors = [`customer_name.ilike.%${term}%`, `client_id.ilike.%${term}%`];
      if (digits.length >= 4) ors.push(`customer_mobile.ilike.%${digits}%`);
      const { data } = await supabase.from("customer_orders")
        .select("id,customer_name,customer_mobile,client_id,customer_city,customer_building_name,customer_landmark,designer_name,windows_count,status,created_at")
        .or(ors.join(",")).order("created_at", { ascending: false }).limit(8);
      if (alive) { setHits(data || []); setSearching(false); }
    }, 250);
    return () => { alive = false; clearTimeout(t); };
  }, [q]);
  const pickOrder = (o) => {
    const addr = [o.customer_building_name, o.customer_landmark, o.customer_city].filter(Boolean).join(", ");
    setForm(f => ({ ...f, order_id: o.id, client_id: o.client_id || "", mobile: o.customer_mobile || "",
      customer_name: f.customer_name || o.customer_name || "", address: f.address || addr,
      stylist: f.stylist || (DESIGNERS.includes(o.designer_name) ? o.designer_name : f.stylist) }));
    setQ(""); setHits([]);
  };
  // --- Installation: pick which curtains are being installed on this visit ---
  const [orderItems, setOrderItems] = useState(null);   // null = not loaded
  const [prior, setPrior] = useState({});               // key -> "08 Oct (Completed)"
  const [picked, setPicked] = useState({});
  const isInstall = form.visit_type === "Installation";
  useEffect(() => {
    setOrderItems(null); setPrior({});
    if (keepSelection.current) {
      keepSelection.current = false;
      const saved = initial.install_items || [];
      setPicked(Object.fromEntries(saved.filter(it => !String(it.key).startsWith("x-")).map(it => [it.key, true])));
      setExtras(saved.filter(it => String(it.key).startsWith("x-")));
    } else { setPicked({}); setExtras([]); }
    if (!form.order_id) return;
    let alive = true;
    (async () => {
      const [o, fv] = await Promise.all([
        supabase.from("customer_orders").select("id,windows").eq("id", form.order_id).single(),
        supabase.from("field_visits").select("id,visit_date,status,install_items").eq("order_id", form.order_id).is("deleted_at", null),
      ]);
      if (!alive) return;
      setOrderItems(orderInstallItems(o.data));
      const pr = {};
      (fv.data || []).filter(v => !isEdit || v.id !== initial.id).forEach(v => (v.install_items || []).forEach(it => {
        const d = new Date(v.visit_date + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" });
        pr[it.key] = `${d}${v.status ? " · " + v.status : ""}`;
      }));
      setPrior(pr);
    })();
    return () => { alive = false; };
  }, [form.order_id]);
  const [extras, setExtras] = useState([]);   // custom "Other" items typed by the office
  const [extraText, setExtraText] = useState("");
  const addExtra = () => {
    const t = extraText.trim(); if (!t) return;
    setExtras(x => [...x, { key: `x-${Date.now()}-${x.length}`, label: t, layer: "" }]); setExtraText("");
  };
  const pickedCount = Object.values(picked).filter(Boolean).length + extras.length;
  const groups = useMemo(() => {
    const g = []; (orderItems || []).forEach(it => { let x = g.find(y => y.label === it.label); if (!x) { x = { label: it.label, items: [] }; g.push(x); } x.items.push(it); });
    return g;
  }, [orderItems]);
  const submit = async (e) => {
    e.preventDefault();
    if (!form.customer_name.trim()) { setErr("Customer name is required."); return; }
    if (/install/i.test(form.visit_type) && !form.order_id) { setErr("Please link the customer's order so the installer gets the curtain checklist."); return; }
    if (isInstall && orderItems && (orderItems.length || extras.length) && pickedCount === 0) { setErr("Select the curtains being installed on this visit."); return; }
    setSaving(true); setErr(null);
    const install_items = isInstall && orderItems ? [...orderItems.filter(it => picked[it.key]), ...extras] : null;
    try { await onSave({ ...form, install_items }); } catch (ex) { setErr(ex.message || "Could not save."); setSaving(false); }
  };
  return (
    <div className="fixed inset-0 z-50 bg-gray-900/50 flex items-end sm:items-center justify-center sm:p-4" onClick={onClose}>
      <form onSubmit={submit} noValidate className="bg-white border border-gray-200 w-full max-w-lg max-h-[92vh] overflow-y-auto overflow-x-hidden scrollbar-thin shadow-card rounded-t-2xl sm:rounded-2xl" onClick={e => e.stopPropagation()}>
        <div className="sticky top-0 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">
          <h3 className="text-base sm:text-lg font-semibold text-gray-900">{isEdit ? "Edit visit" : "Add visit"}</h3>
          <button type="button" onClick={onClose} aria-label="Close" className="w-9 h-9 rounded-full hover:bg-gray-100 text-gray-500 text-2xl leading-none inline-flex items-center justify-center">×</button>
        </div>
        {err && <div className="mx-4 mt-3 p-3 rounded-lg bg-red-50 border border-red-200 text-red-800 text-sm">{err}</div>}
        <div className="p-4 grid grid-cols-1 sm:grid-cols-2 gap-3">
          <Input label="Date *" type="date" value={form.visit_date} onChange={set("visit_date")} />
          <Input label="Time" placeholder="e.g. 11:00 AM" value={form.timing} onChange={set("timing")} />
          <div className="sm:col-span-2">
            <div className="text-xs uppercase tracking-wider text-gray-500 font-semibold">Link to order <span className="normal-case tracking-normal text-gray-400">(needed for the installation checklist)</span></div>
            {form.order_id ? (
              <div className="mt-1 flex items-center justify-between gap-2 rounded-md border border-blue-200 bg-blue-50 px-3 py-2 text-sm">
                <div className="min-w-0 truncate"><span className="font-mono font-semibold text-blue-700">{form.client_id || "—"}</span> · Order #{form.order_id} · {form.customer_name}{form.mobile ? ` · ${form.mobile}` : ""}</div>
                <button type="button" onClick={() => setForm(f => ({ ...f, order_id: null, client_id: "", mobile: "" }))} className="text-xs text-red-600 shrink-0">Unlink</button>
              </div>
            ) : (
              <div className="relative mt-1">
                <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search by customer name, mobile or Client ID…"
                  className="w-full bg-white border border-gray-300 rounded-md px-3 py-2.5 text-base sm:text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" />
                {(hits.length > 0 || searching) && (
                  <div className="absolute z-20 mt-1 w-full bg-white border border-gray-200 rounded-md shadow-lg max-h-64 overflow-y-auto text-sm">
                    {searching && hits.length === 0 && <div className="px-3 py-2 text-gray-500">Searching…</div>}
                    {hits.map(o => (
                      <button type="button" key={o.id} onClick={() => pickOrder(o)} className="block w-full text-left px-3 py-2 hover:bg-blue-50 border-b border-gray-100 last:border-0">
                        <div className="font-medium text-gray-900">{o.customer_name || "—"} <span className="font-mono text-xs text-blue-700 ml-1">{o.client_id || ""}</span></div>
                        <div className="text-xs text-gray-500">#{o.id} · {o.customer_mobile || "—"} · {o.customer_city || ""} · {o.windows_count ?? "?"} windows · {o.designer_name || ""} · {o.status || ""}</div>
                      </button>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
          <Input label="Customer name *" value={form.customer_name} onChange={set("customer_name")} wide />
          <Input label="Address" value={form.address} onChange={set("address")} wide />
          <Select label="Stylist" value={form.stylist} onChange={set("stylist")} options={DESIGNERS} allowEmpty />
          <Select label="Support staff" value={form.support_name} onChange={set("support_name")} options={supportFor(city)} allowEmpty />
          <Select label="Visit type" value={form.visit_type} onChange={set("visit_type")} options={VISIT_TYPES} wide />
          {isInstall && form.order_id && (
            <div className="sm:col-span-2 rounded-lg border border-gray-200">
              <div className="flex items-center justify-between px-3 py-2 border-b border-gray-200 bg-gray-50 rounded-t-lg">
                <div className="text-xs uppercase tracking-wider text-gray-600 font-semibold">Curtains to install on this visit <span className="normal-case tracking-normal text-gray-500">· {pickedCount} selected</span></div>
                {orderItems && orderItems.length > 0 && (
                  <div className="flex gap-3 text-xs font-medium">
                    <button type="button" className="text-blue-600" onClick={() => setPicked(Object.fromEntries(orderItems.filter(it => !prior[it.key]).map(it => [it.key, true])))}>Select pending</button>
                    <button type="button" className="text-blue-600" onClick={() => setPicked(Object.fromEntries(orderItems.map(it => [it.key, true])))}>All</button>
                    <button type="button" className="text-gray-500" onClick={() => setPicked({})}>None</button>
                  </div>
                )}
              </div>
              {orderItems === null ? <div className="px-3 py-3 text-sm text-gray-500">Loading order…</div>
                : orderItems.length === 0 ? <div className="px-3 py-3 text-sm text-gray-500">This order has no curtain or blind items.</div>
                : <div className="max-h-72 overflow-y-auto divide-y divide-gray-100">
                    {groups.map(g => (
                      <div key={g.label} className="px-3 py-2">
                        <div className="text-sm font-medium text-gray-900">{g.label}</div>
                        <div className="flex flex-wrap gap-2 mt-1.5">
                          {g.items.map(it => (
                            <label key={it.key} className={`inline-flex items-center gap-2 px-3 py-1.5 rounded-full border text-sm cursor-pointer ${picked[it.key] ? "bg-blue-50 border-blue-400 text-blue-800" : "bg-white border-gray-300 text-gray-700"}`}>
                              <input type="checkbox" className="accent-blue-600" checked={!!picked[it.key]} onChange={e => setPicked(p => ({ ...p, [it.key]: e.target.checked }))} />
                              {it.layer}
                              {prior[it.key] && <span className="text-[10px] text-amber-700 bg-amber-50 border border-amber-200 rounded px-1">{prior[it.key]}</span>}
                            </label>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>}
              {orderItems !== null && (
                <div className="px-3 py-2 border-t border-gray-200 bg-gray-50/60 rounded-b-lg">
                  <div className="text-sm font-medium text-gray-900">Other</div>
                  {extras.length > 0 && (
                    <div className="flex flex-wrap gap-2 mt-1.5">
                      {extras.map(x => (
                        <span key={x.key} className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full border text-sm bg-blue-50 border-blue-400 text-blue-800">
                          {x.label}
                          <button type="button" aria-label="Remove" onClick={() => setExtras(xs => xs.filter(y => y.key !== x.key))} className="text-blue-500 hover:text-red-600 leading-none text-base">×</button>
                        </span>
                      ))}
                    </div>
                  )}
                  <div className="flex gap-2 mt-1.5">
                    <input value={extraText} onChange={e => setExtraText(e.target.value)}
                      onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addExtra(); } }}
                      placeholder="e.g. Tie-backs for living room, Pelmet, Hall window 2 main…"
                      className="flex-1 min-w-0 bg-white border border-gray-300 rounded-md px-3 py-2 text-base sm:text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" />
                    <button type="button" onClick={addExtra} disabled={!extraText.trim()} className="px-4 py-2 rounded-md bg-blue-600 text-white text-sm font-semibold disabled:opacity-40">Add</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
        <div className="sticky bottom-0 bg-white border-t border-gray-200 px-4 py-3 pb-safe flex flex-col-reverse sm:flex-row gap-2 sm:justify-end">
          <button type="button" onClick={onClose} className="w-full sm:w-auto px-4 py-3 rounded-lg bg-white hover:bg-gray-50 text-sm border border-gray-300 text-gray-700 font-medium min-h-[44px]">Cancel</button>
          <button type="submit" disabled={saving} className="w-full sm:w-auto px-5 py-3 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold disabled:opacity-60 min-h-[44px]">{saving ? "Saving…" : isEdit ? "Save changes" : "Add visit"}</button>
        </div>
      </form>
    </div>
  );
}

// =========================================================
//        Field team (admin): expenses, job reports, petty cash
// =========================================================
const fileUrl = (path) => path ? `${SUPABASE_URL}/storage/v1/object/public/invoices/${path}` : null;
const inrA = n => "₹" + Number(n || 0).toLocaleString("en-IN", { maximumFractionDigits: 0 });
const ftMonthRange = () => { const d = new Date(); const p = n => String(n).padStart(2, "0"); return { from: `${d.getFullYear()}-${p(d.getMonth() + 1)}-01`, to: `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}` }; };
const fmtD = iso => iso ? new Date(iso + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" }) : "";
const expTotal = e => Number(e.fare_to || 0) + Number(e.fare_back || 0);
const expPaths = (e, leg) => { const arr = e[`invoice_${leg}_paths`]; return (arr && arr.length) ? arr : (e[`invoice_${leg}_path`] ? [e[`invoice_${leg}_path`]] : []); };
const REVIEW_UI = { pending: ["Pending", "bg-amber-100 text-amber-800"], approved: ["Approved", "bg-green-100 text-green-800"], rejected: ["Rejected", "bg-red-100 text-red-700"] };

function Thumbs({ paths }) {
  return <div className="flex flex-wrap gap-1">{paths.map(p => <a key={p} href={fileUrl(p)} target="_blank" rel="noopener"><img src={fileUrl(p)} alt="" className="h-10 w-10 object-cover rounded border border-gray-200 hover:ring-2 hover:ring-blue-400" /></a>)}</div>;
}

function FieldTeamView({ city, user }) {
  const [sub, setSub] = useState("expenses");
  const [{ from, to }, setRange] = useState(ftMonthRange());
  const [who, setWho] = useState("");
  const [staff, setStaff] = useState([]);
  const [exps, setExps] = useState(null);
  const [jobs, setJobs] = useState(null);
  const [advs, setAdvs] = useState(null);
  const [allExpForBal, setAllExpForBal] = useState([]);
  const [revFilter, setRevFilter] = useState("all");
  const [err, setErr] = useState(null);
  const [tick, setTick] = useState(0);
  const reload = () => setTick(t => t + 1);

  useEffect(() => {
    let alive = true; setErr(null); setExps(null); setJobs(null); setAdvs(null);
    (async () => {
      const st = await supabase.from("staff").select("*").eq("city", city).order("role").order("name");
      if (!alive) return;
      if (st.error) { setErr(st.error.message); return; }
      const list = (st.data || []).filter(s => s.active !== false); setStaff(list);
      const ids = list.map(s => s.id); if (!ids.length) { setExps([]); setJobs([]); setAdvs([]); return; }
      const [e, j, a, eAll] = await Promise.all([
        supabase.from("travel_expenses").select("*").in("staff_id", ids).gte("expense_date", from).lte("expense_date", to).order("expense_date", { ascending: false }).order("created_at", { ascending: false }),
        supabase.from("job_completions").select("*").in("staff_id", ids).gte("job_date", from).lte("job_date", to).order("job_date", { ascending: false }),
        supabase.from("petty_cash_advances").select("*").in("staff_id", ids).order("advance_date", { ascending: false }),
        supabase.from("travel_expenses").select("staff_id,fare_to,fare_back,payment_method,review_status").in("staff_id", ids),
      ]);
      if (!alive) return;
      if (e.error || j.error || a.error) { setErr((e.error || j.error || a.error).message); return; }
      setExps(e.data || []); setJobs(j.data || []); setAdvs(a.data || []); setAllExpForBal(eAll.data || []);
    })();
    return () => { alive = false; };
  }, [city, from, to, tick]);

  const byWho = r => !who || r.staff_id === who;
  const review = async (e, status) => {
    let note = null;
    if (status === "rejected") { note = prompt("Reason for rejecting this bill?"); if (note === null) return; }
    const patch = { review_status: status, reviewed_by: user?.full_name || user?.email || "Admin", reviewed_at: new Date().toISOString(), review_note: note };
    const { error } = await supabase.from("travel_expenses").update(patch).eq("id", e.id);
    if (error) { alert("Could not update: " + error.message); return; }
    setExps(xs => xs.map(x => x.id === e.id ? { ...x, ...patch } : x));
    setAllExpForBal(xs => xs.map(x => x.id === e.id ? { ...x, review_status: status } : x));
  };

  const approveAll = async (list) => {
    const pend = list.filter(e => (e.review_status || "pending") === "pending");
    if (!pend.length) return;
    const total = pend.reduce((t, e) => t + expTotal(e), 0);
    if (!confirm(`Approve ${pend.length} pending bill${pend.length === 1 ? "" : "s"} worth ${inrA(total)}?`)) return;
    const patch = { review_status: "approved", reviewed_by: user?.full_name || user?.email || "Admin", reviewed_at: new Date().toISOString(), review_note: null };
    const ids = pend.map(e => e.id);
    const { error } = await supabase.from("travel_expenses").update(patch).in("id", ids);
    if (error) { alert("Could not approve: " + error.message); return; }
    const set = new Set(ids);
    setExps(xs => xs.map(x => set.has(x.id) ? { ...x, ...patch } : x));
    setAllExpForBal(xs => xs.map(x => set.has(x.id) ? { ...x, review_status: "approved" } : x));
  };
  const Tab = ({ id, children }) => <button onClick={() => setSub(id)} className={`px-4 py-2 rounded-full text-sm font-medium border ${sub === id ? "bg-blue-600 text-white border-blue-600" : "bg-white text-gray-700 border-gray-300 hover:bg-gray-50"}`}>{children}</button>;
  const inputCls = "bg-white border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-blue-500";
  const th = "px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-600 whitespace-nowrap";

  const ex = (exps || []).filter(byWho).filter(e => revFilter === "all" || (e.review_status || "pending") === revFilter);
  const jb = (jobs || []).filter(byWho);
  const ad = (advs || []).filter(byWho);

  // per-staff money summary (petty cash balance uses all-time figures)
  const summary = staff.map(s => {
    const mine = (exps || []).filter(e => e.staff_id === s.id && e.review_status !== "rejected");
    const allMine = allExpForBal.filter(e => e.staff_id === s.id && e.review_status !== "rejected");
    const recv = (advs || []).filter(a => a.staff_id === s.id).reduce((t, a) => t + Number(a.amount || 0), 0);
    const cashSpentAll = allMine.filter(e => e.payment_method === "Petty cash").reduce((t, e) => t + expTotal(e), 0);
    return { s, bills: mine.length, total: mine.reduce((t, e) => t + expTotal(e), 0),
      upi: mine.filter(e => e.payment_method === "UPI").reduce((t, e) => t + expTotal(e), 0),
      cash: mine.filter(e => e.payment_method === "Petty cash").reduce((t, e) => t + expTotal(e), 0),
      pending: (exps || []).filter(e => e.staff_id === s.id && (e.review_status || "pending") === "pending").length,
      balance: recv - cashSpentAll };
  });

  const exportExpenses = () => downloadCSV(`dmoksha_expenses_${city.toLowerCase()}_${from}_to_${to}.csv`, ex, [
    { label: "Date", get: e => e.expense_date }, { label: "Staff", get: e => e.staff_name }, { label: "Customer", get: e => e.customer_name },
    { label: "Fare to", get: e => e.fare_to }, { label: "Fare back", get: e => e.fare_back }, { label: "Total", get: e => expTotal(e) },
    { label: "Paid using", get: e => e.payment_method }, { label: "Note", get: e => e.note }, { label: "Review", get: e => e.review_status || "pending" },
    { label: "Reviewed by", get: e => e.reviewed_by }, { label: "Review note", get: e => e.review_note },
    { label: "Bills", get: e => [...expPaths(e, "to"), ...expPaths(e, "back")].map(fileUrl).join(" ") },
  ]);
  const exportJobs = () => downloadCSV(`dmoksha_job_reports_${city.toLowerCase()}_${from}_to_${to}.csv`, jb, [
    { label: "Date", get: j => j.job_date }, { label: "Staff", get: j => j.staff_name }, { label: "Job", get: j => j.job_type },
    { label: "Client ID", get: j => j.client_id }, { label: "Customer", get: j => j.customer_name }, { label: "Status", get: j => j.status },
    { label: "Items ticked", get: j => Object.values(j.checklist || {}).filter(Boolean).length },
    { label: "Feedback given", get: j => j.details?.feedback || "" }, { label: "Amount collected", get: j => j.details?.amount || "" },
    { label: "Payment mode", get: j => j.details?.mode || "" }, { label: "Pieces", get: j => j.details?.pieces || "" },
    { label: "Note", get: j => j.note }, { label: "Unfinished reason", get: j => j.unfinished_reason },
    { label: "Photos", get: j => (j.photos || []).map(fileUrl).join(" ") },
  ]);

  return (
    <section>
      <div className="flex flex-wrap items-end justify-between gap-3 mb-4">
        <div>
          <h2 className="text-lg sm:text-xl font-semibold text-gray-900">Field team · {city}</h2>
          <p className="text-sm text-gray-500">Travel bills, job reports and petty cash submitted from the support-team portal.</p>
        </div>
        <div className="flex flex-wrap items-center gap-2">
          <input type="date" value={from} onChange={e => setRange(r => ({ ...r, from: e.target.value }))} className={inputCls} />
          <span className="text-gray-400">→</span>
          <input type="date" value={to} onChange={e => setRange(r => ({ ...r, to: e.target.value }))} className={inputCls} />
          <select value={who} onChange={e => setWho(e.target.value)} className={inputCls}>
            <option value="">All staff</option>
            {staff.map(s => <option key={s.id} value={s.id}>{s.name} ({s.role})</option>)}
          </select>
        </div>
      </div>
      <div className="flex flex-wrap gap-2 mb-4">
        <Tab id="expenses">Travel expenses {exps && <span className="ml-1 opacity-80">({(exps || []).filter(byWho).length})</span>}</Tab>
        <Tab id="jobs">Job reports {jobs && <span className="ml-1 opacity-80">({jb.length})</span>}</Tab>
        <Tab id="cash">Petty cash</Tab>
      </div>
      {err && <div className="p-3 mb-4 rounded-lg bg-red-50 border border-red-200 text-red-800 text-sm">Could not load: {err}</div>}

      {sub === "expenses" && (
        <div className="space-y-4">
          <div className="overflow-x-auto scrollbar-thin rounded-xl border border-gray-200 bg-white shadow-card">
            <table className="w-full text-sm">
              <thead><tr className="border-b border-gray-200 bg-gray-50"><th className={th}>Staff</th><th className={th}>Bills</th><th className={th}>Total</th><th className={th}>UPI (reimburse)</th><th className={th}>Petty cash used</th><th className={th}>Awaiting review</th><th className={th}>Petty cash in hand</th></tr></thead>
              <tbody>
                {summary.filter(r => !who || r.s.id === who).map(r => (
                  <tr key={r.s.id} className="border-b border-gray-100 last:border-0 hover:bg-gray-50 cursor-pointer" onClick={() => setWho(w => w === r.s.id ? "" : r.s.id)}>
                    <td className="px-3 py-2 font-medium text-gray-900">{r.s.name} <span className="text-xs text-gray-500 capitalize">· {r.s.role}</span></td>
                    <td className="px-3 py-2">{r.bills}</td><td className="px-3 py-2 font-semibold">{inrA(r.total)}</td>
                    <td className="px-3 py-2">{inrA(r.upi)}</td><td className="px-3 py-2">{inrA(r.cash)}</td>
                    <td className="px-3 py-2">{r.pending > 0 ? <span className="text-amber-700 font-semibold">{r.pending}</span> : "—"}</td>
                    <td className={`px-3 py-2 font-semibold ${r.balance < 0 ? "text-red-700" : "text-gray-900"}`}>{inrA(r.balance)}</td>
                  </tr>
                ))}
                {staff.length === 0 && <tr><td colSpan="7" className="text-center py-8 text-gray-500">No field staff set up for {city}.</td></tr>}
              </tbody>
            </table>
          </div>
          <div className="flex flex-wrap items-center justify-between gap-2">
            <div className="flex gap-1 p-1 bg-gray-100 rounded-lg text-sm">
              {["all", "pending", "approved", "rejected"].map(k => <button key={k} onClick={() => setRevFilter(k)} className={`px-3 py-1.5 rounded-md capitalize ${revFilter === k ? "bg-white shadow font-semibold text-gray-900" : "text-gray-600"}`}>{k}</button>)}
            </div>
            <div className="flex gap-2">
              {(() => { const n = ex.filter(e => (e.review_status || "pending") === "pending").length; return (
                <button onClick={() => approveAll(ex)} disabled={!n} className="px-4 py-2 rounded-md bg-green-600 hover:bg-green-700 text-white text-sm font-semibold disabled:opacity-40">✓ Approve all pending{n ? ` (${n})` : ""}</button>); })()}
              <button onClick={exportExpenses} disabled={!ex.length} className="px-4 py-2 rounded-md bg-blue-600 text-white text-sm font-semibold disabled:opacity-50">Download CSV</button>
            </div>
          </div>
          <div className="overflow-x-auto scrollbar-thin rounded-xl border border-gray-200 bg-white shadow-card">
            <table className="w-full text-sm">
              <thead><tr className="border-b border-gray-200 bg-gray-50"><th className={th}>Date</th><th className={th}>Staff</th><th className={th}>Customer</th><th className={th}>To</th><th className={th}>Back</th><th className={th}>Total</th><th className={th}>Paid using</th><th className={th}>Bills</th><th className={th}>Review</th></tr></thead>
              <tbody>
                {exps === null && <tr><td colSpan="9" className="text-center py-10 text-gray-500">Loading…</td></tr>}
                {exps && ex.length === 0 && <tr><td colSpan="9" className="text-center py-10 text-gray-500">No travel bills in this range.</td></tr>}
                {ex.map(e => {
                  const rs = e.review_status || "pending"; const ui = REVIEW_UI[rs] || REVIEW_UI.pending;
                  return (
                    <tr key={e.id} className="border-b border-gray-100 last:border-0 align-top">
                      <td className="px-3 py-2 whitespace-nowrap">{fmtD(e.expense_date)}</td>
                      <td className="px-3 py-2 whitespace-nowrap font-medium">{e.staff_name}</td>
                      <td className="px-3 py-2">{e.customer_name || "—"}{e.note && <div className="text-xs text-gray-500 mt-0.5 max-w-xs">{e.note}</div>}</td>
                      <td className="px-3 py-2 whitespace-nowrap">{inrA(e.fare_to)}<div className="mt-1"><Thumbs paths={expPaths(e, "to")} /></div></td>
                      <td className="px-3 py-2 whitespace-nowrap">{inrA(e.fare_back)}<div className="mt-1"><Thumbs paths={expPaths(e, "back")} /></div></td>
                      <td className="px-3 py-2 font-semibold whitespace-nowrap">{inrA(expTotal(e))}</td>
                      <td className="px-3 py-2 whitespace-nowrap">{e.payment_method}</td>
                      <td className="px-3 py-2 text-xs text-gray-500 whitespace-nowrap">{expPaths(e, "to").length + expPaths(e, "back").length} image(s)</td>
                      <td className="px-3 py-2 whitespace-nowrap">
                        <span className={`text-[11px] font-semibold rounded px-1.5 py-0.5 ${ui[1]}`}>{ui[0]}</span>
                        {e.reviewed_by && <div className="text-[11px] text-gray-500 mt-0.5">{e.reviewed_by}{e.review_note ? ` — ${e.review_note}` : ""}</div>}
                        {e.paid_on && <div className="text-[11px] font-semibold text-green-700 mt-0.5">Paid {fmtD(e.paid_on)}{e.payment_ref ? ` · ${e.payment_ref}` : ""}</div>}
                        <div className="flex gap-2 mt-1">
                          {rs !== "approved" && <button onClick={() => review(e, "approved")} className="text-xs font-semibold text-green-700 hover:underline">Approve</button>}
                          {rs !== "rejected" && <button onClick={() => review(e, "rejected")} className="text-xs font-semibold text-red-600 hover:underline">Reject</button>}
                          {rs !== "pending" && <button onClick={() => review(e, "pending")} className="text-xs text-gray-500 hover:underline">Undo</button>}
                        </div>
                      </td>
                    </tr>);
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {sub === "jobs" && (
        <div className="space-y-3">
          <div className="flex justify-end"><button onClick={exportJobs} disabled={!jb.length} className="px-4 py-2 rounded-md bg-blue-600 text-white text-sm font-semibold disabled:opacity-50">Download CSV</button></div>
          {jobs === null && <div className="text-center py-10 text-gray-500">Loading…</div>}
          {jobs && jb.length === 0 && <div className="text-center py-10 text-gray-500 bg-white rounded-xl border border-gray-200">No installation or maintenance job reports in this range.</div>}
          {jb.map(j => {
            const ticked = Object.values(j.checklist || {}).filter(Boolean).length; const d = j.details || {};
            const st = j.status === "completed" ? ["Completed", "bg-green-100 text-green-800"] : j.status === "unfinished" ? ["Unfinished", "bg-amber-100 text-amber-800"] : ["In progress", "bg-blue-100 text-blue-800"];
            return (
              <div key={j.id} className="bg-white border border-gray-200 rounded-xl p-4 shadow-card">
                <div className="flex flex-wrap items-start justify-between gap-2">
                  <div>
                    <div className="text-xs font-semibold text-blue-600">{fmtD(j.job_date)} · {j.job_type} · {j.staff_name}</div>
                    <div className="font-semibold text-gray-900">{j.customer_name || "—"} {j.client_id && <span className="font-mono text-xs text-blue-700 ml-1">{j.client_id}</span>}{j.order_id && <span className="text-xs text-gray-500 ml-2">Order #{j.order_id}</span>}</div>
                  </div>
                  <span className={`text-[11px] font-semibold rounded px-2 py-0.5 ${st[1]}`}>{st[0]}</span>
                </div>
                <div className="flex flex-wrap gap-x-5 gap-y-1 text-sm text-gray-700 mt-2">
                  {ticked > 0 && <span>✓ {ticked} checklist item{ticked === 1 ? "" : "s"} ticked</span>}
                  {d.feedback && <span>Feedback: <b className={d.feedback === "Yes" ? "text-green-700" : "text-amber-700"}>{d.feedback}</b>{d.feedback_reason ? ` (${d.feedback_reason})` : ""}</span>}
                  {d.amount && <span>Collected: <b>{inrA(d.amount)}</b> {d.mode ? `· ${d.mode}` : ""}{d.ref ? ` · Ref ${d.ref}` : ""}</span>}
                  {d.pieces && <span>Pieces: <b>{d.pieces}</b></span>}
                  {d.reason && <span>Alteration: {d.reason}</span>}
                  {d.items && <span>Items: {d.items}</span>}
                  {j.completed_at && <span className="text-gray-500">Submitted {new Date(j.completed_at).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" })}</span>}
                </div>
                {j.unfinished_reason && <div className="mt-2 text-sm bg-amber-50 border border-amber-200 rounded-lg p-2 text-amber-900">Not finished: {j.unfinished_reason}</div>}
                {j.note && <div className="mt-2 text-sm text-gray-600">📝 {j.note}</div>}
                {(j.photos || []).length > 0 && <div className="mt-2"><Thumbs paths={j.photos} /></div>}
              </div>);
          })}
        </div>
      )}

      {sub === "cash" && <PettyCashPanel staff={staff} advs={ad} who={who} user={user} onChanged={reload} summary={summary} />}
    </section>
  );
}

  const groups = [];
  unpaid.forEach(r => { let g = groups.find(x => x.id === r.staff_id); if (!g) { g = { id: r.staff_id, name: r.staff_name, bills: [] }; groups.push(g); } g.bills.push(r); });

  groups.sort((a, b) => roleRank(a.id) - roleRank(b.id) || a.name.localeCompare(b.name));
  const dueTotal = unpaid.reduce((t, r) => t + expTotal(r), 0);
  const th = "px-3 py-2 text-left text-[11px] font-semibold uppercase tracking-wider text-gray-600 whitespace-nowrap";

    { label: "Customer", get: r => r.customer_name }, { label: "Fare to", get: r => r.fare_to }, { label: "Fare back", get: r => r.fare_back }, { label: "Total", get: r => expTotal(r) },

  return (

        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
          <div className="flex items-center gap-4 min-w-0">

            <div className="hidden md:block border-l border-gray-200 pl-4"><div className="font-semibold text-gray-900">Accounts</div><div className="text-xs text-gray-500">Field team expenses & payments</div></div>
          </div>
          <div className="flex rounded-full overflow-hidden border border-gray-300 bg-gray-50 shrink-0">
            {[["fieldteam", "Field team"], ["payments", "Payments"]].map(([k, l]) => (

            </select>

              <option value="">All people</option>

        {rows === null && !err && <div className="text-center py-16 text-gray-500">Loading…</div>}

              const amt = g.bills.reduce((t, r) => t + expTotal(r), 0); const st = staffById[g.id];
              return (
